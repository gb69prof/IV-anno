name: Pubblica Dalla collina al vulcano

on:
  push:
    branches: [main]
    paths:
      - "Letteratura/colle-vulcano/src/**"
      - "Letteratura/colle-vulcano/public/**"
      - "Letteratura/colle-vulcano/index.source.html"
      - "Letteratura/colle-vulcano/package.json"
      - "Letteratura/colle-vulcano/package-lock.json"
      - "Letteratura/colle-vulcano/tsconfig.json"
      - "Letteratura/colle-vulcano/vite.config.ts"
      - ".github/workflows/deploy-colle-vulcano.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "leopardi-pages-build"
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Letteratura/colle-vulcano/package-lock.json

      - name: Installa dipendenze
        working-directory: Letteratura/colle-vulcano
        run: npm ci

      - name: Crea il sito statico
        working-directory: Letteratura/colle-vulcano
        run: npm run build

      - name: Copia la build nella cartella pubblicata
        shell: bash
        run: |
          APP_DIR="Letteratura/colle-vulcano"
          rm -rf "$APP_DIR/assets" "$APP_DIR/images"
          mkdir -p "$APP_DIR/assets" "$APP_DIR/images"
          cp "$APP_DIR/dist/index.source.html" "$APP_DIR/index.html"
          cp -R "$APP_DIR/dist/assets/." "$APP_DIR/assets/"
          cp -R "$APP_DIR/dist/images/." "$APP_DIR/images/"
          cp "$APP_DIR/dist/favicon.svg" "$APP_DIR/favicon.svg"
          cp "$APP_DIR/dist/manifest.webmanifest" "$APP_DIR/manifest.webmanifest"
          cp "$APP_DIR/dist/sw.js" "$APP_DIR/sw.js"

      - name: Salva la build su main
        shell: bash
        run: |
          APP_DIR="Letteratura/colle-vulcano"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --             "$APP_DIR/index.html"             "$APP_DIR/assets"             "$APP_DIR/images"             "$APP_DIR/favicon.svg"             "$APP_DIR/manifest.webmanifest"             "$APP_DIR/sw.js"
          if git diff --cached --quiet; then
            echo "Build già aggiornata."
          else
            git commit -m "Publish Leopardi static site"
            git push
          fi
