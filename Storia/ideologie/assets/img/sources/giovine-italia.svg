<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100"><rect width="900" height="1100" fill="#d8cdbd"/><rect x="75" y="55" width="750" height="990" fill="#fffaf2" stroke="#70627e" stroke-width="5"/><text x="450" y="145" text-anchor="middle" font-family="Georgia" font-size="48" fill="#29213c">LA GIOVINE ITALIA</text><text x="450" y="195" text-anchor="middle" font-family="system-ui" font-size="23" fill="#9e4454">ISTRUZIONE GENERALE · 1831</text><path d="M150 235h600" stroke="#d3a956" stroke-width="4"/><g font-family="Georgia" font-size="26" fill="#332b3f"><text x="130" y="320">L'associazione è essenzialmente educatrice</text><text x="130" y="365">e tende a uno scopo d'insurrezione.</text><text x="130" y="470">L'Italia dev'essere una, indipendente,</text><text x="130" y="515">libera, repubblicana.</text></g><rect x="120" y="600" width="660" height="235" rx="18" fill="#eee9f1"/><text x="450" y="665" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#29213c">FACSIMILE DIDATTICO</text><text x="450" y="715" text-anchor="middle" font-family="system-ui" font-size="20" fill="#5f5669">Estratto breve; impaginazione non originale.</text><text x="450" y="765" text-anchor="middle" font-family="system-ui" font-size="20" fill="#5f5669">Apri la fonte per leggere contesto e limiti.</text><text x="450" y="930" text-anchor="middle" font-family="Georgia" font-size="27" fill="#9e4454">Educazione e insurrezione: in quale ordine?</text></svg>
