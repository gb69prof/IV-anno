<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc"><title id="title">Che cos’è la schiavitù</title><desc id="desc">PERSONA. Poteri di proprietà|vendita, eredità, controllo. Coercizione|lavoro e mobilità imposti. Famiglie|legami esposti alla vendita. Resistenza|reti, fuga, petizioni. ABOLIZIONE|negare la proprietà sulla persona</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d7b576"/></marker></defs><rect width="1100" height="820" fill="#061d2f"/><rect x="14" y="14" width="1072" height="792" rx="10" fill="none" stroke="#d7b576"/><text x="550" y="62" fill="#fff4da" text-anchor="middle" font-family="Georgia,serif" font-size="26">Che cos’è la schiavitù</text><rect x="255" y="98" width="590" height="95" rx="7" fill="#173c52" stroke="#d7b576" stroke-width="2"/><text x="550.0" y="133" fill="#f9e8c5" text-anchor="middle" font-family="Georgia,serif" font-size="24">PERSONA</text><path d="M550 195 L550 230 L290 230 L290 273" fill="none" stroke="#d7b576" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="280" width="450" height="145" rx="7" fill="#f5e8cd" stroke="#d7b576" stroke-width="2"/><text x="290.0" y="315" fill="#172b38" text-anchor="middle" font-family="Georgia,serif" font-size="24">Poteri di proprietà</text><text x="290.0" y="380" fill="#3e3b31" text-anchor="middle" font-family="Georgia,serif" font-size="22">vendita, eredità,</text><text x="290.0" y="409" fill="#3e3b31" text-anchor="middle" font-family="Georgia,serif" font-size="22">controllo</text><path d="M550 195 L550 230 L810 230 L810 273" fill="none" stroke="#d7b576" stroke-width="2" marker-end="url(#a)"/><rect x="585" y="280" width="450" height="145" rx="7" fill="#f5e8cd" stroke="#d7b576" stroke-width="2"/><text x="810.0" y="315" fill="#172b38" text-anchor="middle" font-family="Georgia,serif" font-size="24">Coercizione</text><text x="810.0" y="380" fill="#3e3b31" text-anchor="mid