<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img" aria-labelledby="t d"><title id="t">Il meccanismo dell’esclusione</title><desc id="d">Interesse, giustificazione, normalizzazione, esclusione, resistenza, cambiamento. Una chiave di analisi, non una legge automatica.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#dab572"/></marker></defs><rect width="1100" height="820" fill="#061d2f"/><text x="550" y="72" text-anchor="middle" fill="#fff4da" font-family="Georgia" font-size="34">Il meccanismo dell’esclusione</text><path d="M347 245H393" fill="none" stroke="#dab572" stroke-width="4" marker-end="url(#a)"/><path d="M702 245H748" fill="none" stroke="#dab572" stroke-width="4" marker-end="url(#a)"/><path d="M905 348V433" fill="none" stroke="#dab572" stroke-width="4" marker-end="url(#a)"/><path d="M753 540H709" fill="none" stroke="#dab572" stroke-width="4" marker-end="url(#a)"/><path d="M398 540H354" fill="none" stroke="#dab572" stroke-width="4" marker-end="url(#a)"/><rect x="45" y="145" width="300" height="200" rx="8" fill="#f6ecd7" stroke="#dab572" stroke-width="2"/><text x="195" y="184" text-anchor="middle" fill="#69451b" font-size="22">01</text><text x="195" y="227" text-anchor="middle" fill="#061d2f" font-family="Georgia" font-size="22">INTERESSE</text><text x="195" y="270" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">vantaggio dal dominio</text><rect x="400" y="145" width="300" height="200" rx="8" fill="#f6ecd7" stroke="#dab572" stroke-width="2"/><text x="550" y="184" text-anchor="middle" fill="#69451b" font-size="22">02</text><text x="550" y="227" text-anchor="middle" fill="#061d2f" font-family="Georgia" font-size="22">GIUSTIFICAZIONE</text><text x="550" y="270" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">il vantaggio diventa</text><text x="550" y="300" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">principio</text><rect x="755" y="145" width="300" height="200" rx="8" fill="#f6ecd7" stroke="#dab572" stroke-width="2"/><text x="905" y="184" text-anchor="middle" fill="#69451b" font-size="22">03</text><text x="905" y="227" text-anchor="middle" fill="#061d2f" font-family="Georgia" font-size="22">NORMALIZZAZIONE</text><text x="905" y="270" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">il dominio appare</text><text x="905" y="300" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">abituale</text><rect x="755" y="440" width="300" height="200" rx="8" fill="#f6ecd7" stroke="#dab572" stroke-width="2"/><text x="905" y="479" text-anchor="middle" fill="#69451b" font-size="22">04</text><text x="905" y="522" text-anchor="middle" fill="#061d2f" font-family="Georgia" font-size="22">ESCLUSIONE</text><text x="905" y="565" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">diritti negati a un</text><text x="905" y="595" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">gruppo</text><rect x="400" y="440" width="300" height="200" rx="8" fill="#f6ecd7" stroke="#dab572" stroke-width="2"/><text x="550" y="479" text-anchor="middle" fill="#69451b" font-size="22">05</text><text x="550" y="522" text-anchor="middle" fill="#061d2f" font-family="Georgia" font-size="22">RESISTENZA</text><text x="550" y="565" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">gli esclusi prendono</text><text x="550" y="595" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">parola</text><rect x="45" y="440" width="300" height="200" rx="8" fill="#f6ecd7" stroke="#dab572" stroke-width="2"/><text x="195" y="479" text-anchor="middle" fill="#69451b" font-size="22">06</text><text x="195" y="522" text-anchor="middle" fill="#061d2f" font-family="Georgia" font-size="22">CAMBIAMENTO</text><text x="195" y="565" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">rapporti, leggi,</text><text x="195" y="595" text-anchor="middle" fill="#251e17" font-family="Georgia" font-size="24">diritti</text><text x="550" y="723" text-anchor="middle" fill="#fff4da" font-family="Georgia" font-size="25">Chi trae vantaggio? Chi è escluso? Quali prove? Chi agisce?</text><text x="550" y="768" text-anchor="middle" fill="#dab572" font-family="Georgia" font-size="23">Una chiave di analisi: il cambiamento non è automatico.</text></svg>