<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Espansione e contrazione del sistema napoleonico</title><desc id="d">Confronto schematico fra 1799, 1805, 1811 e 1815.</desc><rect width="1200" height="760" fill="#07162b"/><text x="65" y="70" font-family="Georgia" font-size="42" fill="#f5ead3" font-weight="700">Espansione e contrazione</text><text x="67" y="104" font-family="Arial" font-size="17" fill="#d6aa5e">La superficie indica capacità di controllo, non chilometri quadrati esatti</text>
<line x1="125" y1="600" x2="1080" y2="600" stroke="#d6aa5e" stroke-width="5"/><g font-family="Arial" text-anchor="middle"><g><circle cx="180" cy="490" r="74" fill="#9d2d25"/><text x="180" y="493" fill="#fff" font-size="21" font-weight="700">FRANCIA</text><text x="180" y="640" fill="#f5ead3" font-size="28" font-weight="700">1799</text><text x="180" y="676" fill="#cbbda3" font-size="16">potere da stabilizzare</text></g><g><circle cx="445" cy="420" r="142" fill="#9d2d25"/><circle cx="445" cy="420" r="105" fill="none" stroke="#d6aa5e" stroke-width="18"/><text x="445" y="415" fill="#fff" font-size="21" font-weight="700">EGEMONIA</text><text x="445" y="443" fill="#fff" font-size="16">Austerlitz</text><text x="445" y="640" fill="#f5ead3" font-size="28" font-weight="700">1805</text><text x="445" y="676" fill="#cbbda3" font-size="16">vittoria e Stati clienti</text></g><g><circle cx="755" cy="345" r="218" fill="#9d2d25"/><circle cx="755" cy="345" r="166" fill="none" stroke="#d6aa5e" stroke-width="27"/><circle cx="755" cy="345" r="112" fill="none" stroke="#6280a4" stroke-width="20"/><text x="755" y="340" fill="#fff" font-size="22" font-weight="700">SISTEMA</text><text x="755" y="370" fill="#fff" font-size="16">sovraesteso</text><text x="755" y="640" fill="#f5ead3" font-size="28" font-weight="700">1811</text><text x="755" y="676" fill="#cbbda3" font-size="16">massimo controllo, massimo costo</text></g><g><circle cx="1030" cy="520" r="36" fill="#9d2d25"/><text x="1030" y="526" fill="#fff" font-size="16" font-weight="700">?</text><text x="1030" y="640" fill="#f5ead3" font-size="28" font-weight="700">1815</text><text x="1030" y="676" fill="#cbbda3" font-size="16">Impero caduto, eredità vive</text></g></g><text x="67" y="727" font-family="Arial" font-size="16" fill="#d6aa5e">Ipotesi: quando l’espansione militare smette di produrre sicurezza e comincia a consumarla?</text></svg>
