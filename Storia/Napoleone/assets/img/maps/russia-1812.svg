<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Campagna di Russia del 1812</title><desc id="d">Schema didattico dei percorsi e dei fattori logistici.</desc><rect width="1200" height="760" fill="#f5ead3"/><text x="65" y="70" font-family="Georgia" font-size="42" fill="#07162b" font-weight="700">Russia 1812: la distanza diventa nemico</text><text x="67" y="104" font-family="Arial" font-size="17" fill="#705f49">Tracciato schematico · lo spessore suggerisce la riduzione delle forze</text><path d="M104 580C234 494 304 449 424 398S653 324 795 300s174-19 281-33" fill="none" stroke="#9d2d25" stroke-width="70" stroke-linecap="round"/><path d="M1075 343C936 392 817 432 713 465S468 539 112 634" fill="none" stroke="#173b68" stroke-width="22" stroke-linecap="round"/>
<g fill="#07162b" font-family="Arial"><circle cx="110" cy="580" r="11"/><text x="82" y="545" font-size="22" font-weight="700">Niemen</text><text x="82" y="571" font-size="15">giugno</text><circle cx="515" cy="359" r="11"/><text x="470" y="317" font-size="22" font-weight="700">Smolensk</text><circle cx="833" cy="294" r="11"/><text x="785" y="247" font-size="22" font-weight="700">Borodino</text><circle cx="1075" cy="267" r="11"/><text x="1017" y="226" font-size="22" font-weight="700">Mosca</text><circle cx="550" cy="518" r="11"/><text x="493" y="568" font-size="22" font-weight="700">Beresina</text><text x="104" y="685" font-size="18" font-weight="700">andata: obiettivo decisivo rinviato</text><text x="713" y="520" font-size="18" font-weight="700">ritorno: fame · malattie · freddo · combattimenti</text></g>
<g font-family="Arial" font-size="15" fill="#1c1915"><rect x="81" y="136" width="310" height="115" rx="16" fill="#ead7af"/><text x="106" y="172" font-weight="700">Tre domande logistiche</text><text x="106" y="201">1. quanto è lunga la linea di rifornimento?</text><text x="106" y="226">2. dove trovano foraggio i cavalli?</text><text x="106" y="251">3. quale vittoria produce davvero la pace?</text></g><text x="67" y="727" font-family="Arial" font-size="16" fill="#705f49">Il freddo aggrava il disastro; non spiega da solo perché la campagna sia strategicamente fallita.</text></svg>
