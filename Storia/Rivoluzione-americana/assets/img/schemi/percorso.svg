<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Dalle colonie agli Stati Uniti</title><desc id="desc">Società coloniale: Autogoverno, reti atlantiche, schiavitù e pressione sulle terre native. Crisi imperiale: Debito, tasse e autorità: la questione della rappresentanza. Indipendenza: Guerra dal 1775; Paine e Dichiarazione nel 1776. Vittoria e pace: Saratoga, alleanza francese, Yorktown; Parigi 1783. Nuovo ordinamento: Dagli Articoli alla Costituzione: 1787 firma, 1788 ratifica, 1789 governo. Libertà contesa: Bill of Rights nel 1791; diritti proclamati e partecipazione limitata.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Dalle colonie agli Stati Uniti</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Ripasso del processo · 1763–1791</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Società coloniale</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Autogoverno, reti atlantiche, schiavitù e</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">pressione sulle terre native.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Crisi imperiale</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Debito, tasse e autorità: la questione</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">della rappresentanza.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Indipendenza</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Guerra dal 1775; Paine e Dichiarazione nel</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">1776.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Vittoria e pace</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Saratoga, alleanza francese, Yorktown;</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">Parigi 1783.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Nuovo ordinamento</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Dagli Articoli alla Costituzione: 1787</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">firma, 1788 ratifica, 1789 governo.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Libertà contesa</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Bill of Rights nel 1791; diritti proclamati</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">e partecipazione limitata.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>