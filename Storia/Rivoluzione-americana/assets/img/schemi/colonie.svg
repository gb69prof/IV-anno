<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Le colonie: un equilibrio instabile</title><desc id="desc">Società plurali: Tredici colonie, istituzioni diverse, assemblee locali; nessuna identità nazionale già compiuta. Economie collegate: Porti, agricoltura, piantagioni e scambi atlantici. La schiavitù è legale in tutte le colonie. Terre e sovranità: L’espansione degli insediamenti entra in conflitto con le nazioni native. Guerra e vittoria: 1754–1763: la Gran Bretagna prevale sulla Francia e accresce territori e debito. Nuovo controllo: Londra cerca entrate e ordine. La Proclamation del 1763 limita l’espansione oltre gli Appalachi. La domanda aperta: Chi decide su terre, imposte e commercio: assemblee locali o autorità imperiale?</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Le colonie: un equilibrio instabile</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Autogoverno locale e appartenenza imperiale</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Società plurali</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Tredici colonie, istituzioni diverse,</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">assemblee locali; nessuna identità</text><text x="83" y="322" font-family="sans-serif" font-size="22" fill="#233b48">nazionale già compiuta.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Economie collegate</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Porti, agricoltura, piantagioni e scambi</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">atlantici. La schiavitù è legale in tutte</text><text x="638" y="322" font-family="sans-serif" font-size="22" fill="#233b48">le colonie.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Terre e sovranità</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">L’espansione degli insediamenti entra in</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">conflitto con le nazioni native.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Guerra e vittoria</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">1754–1763: la Gran Bretagna prevale sulla</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">Francia e accresce territori e debito.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Nuovo controllo</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Londra cerca entrate e ordine. La</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">Proclamation del 1763 limita l’espansione</text><text x="83" y="752" font-family="sans-serif" font-size="22" fill="#233b48">oltre gli Appalachi.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">La domanda aperta</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Chi decide su terre, imposte e commercio:</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">assemblee locali o autorità imperiale?</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>