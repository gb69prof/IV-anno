<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Common Sense: cambiare l’orizzonte</title><desc id="desc">Situazione: La guerra è iniziata; la riconciliazione resta ancora un obiettivo per alcuni. Bersaglio: Monarchia ereditaria e dipendenza dalla Gran Bretagna. Linguaggio: Argomenti politici accessibili e immagini efficaci per un pubblico ampio. Proposta: Indipendenza e governo repubblicano. Effetto: Rende discutibile apertamente una scelta prima più difficile da immaginare. Limite della fonte: Non dimostra consenso unanime e non spiega da solo l’indipendenza.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Common Sense: cambiare l’orizzonte</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Gennaio 1776 · Un testo di persuasione</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Situazione</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">La guerra è iniziata; la riconciliazione</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">resta ancora un obiettivo per alcuni.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Bersaglio</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Monarchia ereditaria e dipendenza dalla</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">Gran Bretagna.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Linguaggio</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Argomenti politici accessibili e immagini</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">efficaci per un pubblico ampio.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Proposta</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Indipendenza e governo repubblicano.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Effetto</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Rende discutibile apertamente una scelta</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">prima più difficile da immaginare.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Limite della fonte</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Non dimostra consenso unanime e non spiega</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">da solo l’indipendenza.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>