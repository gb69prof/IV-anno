<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Checks and balances</title><desc id="desc">Presidente → Congresso: Può porre il veto alle leggi. Congresso → Presidente: Può superare il veto con due terzi di entrambe le Camere; controlla le spese. Presidente + Senato: Nomine con il consenso del Senato; trattati con due terzi dei senatori presenti. Camera + Senato: La Camera formula l’impeachment; il Senato giudica le accuse. Giudici federali: Nomina presidenziale con consenso del Senato; permanenza in buona condotta. 1803 · Marbury: Affermazione decisiva del judicial review. Non è formulato esplicitamente nel testo del 1787.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Checks and balances</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Chi può limitare quale decisione?</text><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Presidente → Congresso</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Può porre il veto alle leggi.</text><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Congresso → Presidente</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Può superare il veto con due terzi di</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">entrambe le Camere; controlla le spese.</text><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Presidente + Senato</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Nomine con il consenso del Senato; trattati</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">con due terzi dei senatori presenti.</text><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Camera + Senato</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">La Camera formula l’impeachment; il Senato</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">giudica le accuse.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Giudici federali</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Nomina presidenziale con consenso del</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">Senato; permanenza in buona condotta.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1803 · Marbury</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Affermazione decisiva del judicial review.</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">Non è formulato esplicitamente nel testo</text><text x="638" y="752" font-family="sans-serif" font-size="22" fill="#233b48">del 1787.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>