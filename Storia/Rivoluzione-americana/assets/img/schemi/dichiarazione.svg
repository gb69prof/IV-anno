<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">La struttura della Dichiarazione</title><desc id="desc">Principi: Uguaglianza e diritti naturali: la legittimità non discende dall’eredità dinastica. Governo: I poteri giusti derivano dal consenso dei governati. Resistenza: Un governo distruttivo di quei fini può essere cambiato. Accuse: Elenco delle violazioni attribuite al sovrano: parte argomentativa da verificare. Conclusione: Le colonie si dichiarano Stati liberi e indipendenti. Autori e limiti: Jefferson, Committee of Five, Congresso. Diritti proclamati non equivalgono a inclusione universale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">La struttura della Dichiarazione</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">4 luglio 1776 · Giustificare la separazione</text><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Principi</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Uguaglianza e diritti naturali: la</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">legittimità non discende dall’eredità</text><text x="83" y="322" font-family="sans-serif" font-size="22" fill="#233b48">dinastica.</text><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Governo</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">I poteri giusti derivano dal consenso dei</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">governati.</text><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Resistenza</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Un governo distruttivo di quei fini può</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">essere cambiato.</text><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Accuse</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Elenco delle violazioni attribuite al</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">sovrano: parte argomentativa da verificare.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Conclusione</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Le colonie si dichiarano Stati liberi e</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">indipendenti.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Autori e limiti</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Jefferson, Committee of Five, Congresso.</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">Diritti proclamati non equivalgono a</text><text x="638" y="752" font-family="sans-serif" font-size="22" fill="#233b48">inclusione universale.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>