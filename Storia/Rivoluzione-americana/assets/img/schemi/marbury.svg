<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Marbury v. Madison</title><desc id="desc">Controversia: Marbury chiede un ordine giudiziario per ottenere la consegna della nomina. Questione: Una previsione del Judiciary Act amplia la competenza originaria della Corte. Parametro: La Costituzione definisce quella competenza. Conflitto: La legge ordinaria non può prevalere sulla Costituzione. Decisione: La Corte non concede l’ordine richiesto sulla base della disposizione incompatibile. Significato: Affermazione decisiva del controllo giudiziario sulle leggi federali, con precedenti e dibattiti alle spalle.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Marbury v. Madison</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">1803 · Costituzione e legge ordinaria</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Controversia</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Marbury chiede un ordine giudiziario per</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">ottenere la consegna della nomina.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Questione</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Una previsione del Judiciary Act amplia la</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">competenza originaria della Corte.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Parametro</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">La Costituzione definisce quella</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">competenza.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Conflitto</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">La legge ordinaria non può prevalere sulla</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">Costituzione.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Decisione</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">La Corte non concede l’ordine richiesto</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">sulla base della disposizione</text><text x="83" y="752" font-family="sans-serif" font-size="22" fill="#233b48">incompatibile.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Significato</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Affermazione decisiva del controllo</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">giudiziario sulle leggi federali, con</text><text x="638" y="752" font-family="sans-serif" font-size="22" fill="#233b48">precedenti e dibattiti alle spalle.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>