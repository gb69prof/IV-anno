<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Il dibattito sulla ratifica</title><desc id="desc">Federalisti · Diagnosi: Il centro è troppo debole per garantire la sopravvivenza dell’Unione. Antifederalisti · Diagnosi: Il nuovo centro può diventare distante, elitario e dominante. Federalisti · Proposta: Ratificare una struttura più efficace, articolata e controllata. Antifederalisti · Obiezioni: Poteri troppo estesi e garanzie dei diritti insufficientemente esplicite. 1788 · Ratifica: Il New Hampshire è il nono Stato: raggiunta la soglia prevista. 1789–1791 · Risposta: La promessa di garanzie contribuisce al percorso del Bill of Rights.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Il dibattito sulla ratifica</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Quale rischio minaccia di più la libertà?</text><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Federalisti · Diagnosi</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Il centro è troppo debole per garantire la</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">sopravvivenza dell’Unione.</text><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Antifederalisti · Diagnosi</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Il nuovo centro può diventare distante,</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">elitario e dominante.</text><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Federalisti · Proposta</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Ratificare una struttura più efficace,</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">articolata e controllata.</text><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Antifederalisti · Obiezioni</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Poteri troppo estesi e garanzie dei diritti</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">insufficientemente esplicite.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1788 · Ratifica</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Il New Hampshire è il nono Stato: raggiunta</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">la soglia prevista.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1789–1791 · Risposta</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">La promessa di garanzie contribuisce al</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">percorso del Bill of Rights.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>