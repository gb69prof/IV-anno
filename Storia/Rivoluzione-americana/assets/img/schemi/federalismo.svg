<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Due divisioni del potere</title><desc id="desc">Livello federale: Competenze comuni: moneta, commercio interstatale, difesa. Livello degli Stati: Ampi ambiti interni e istituzioni statali; poteri riservati. Regola comune: Supremazia della Costituzione e delle leggi federali conformi a essa. Legislativo: Congresso: Camera e Senato. Esecutivo: Presidente: mandato quadriennale, elezione tramite grandi elettori. Giudiziario: Corte Suprema e tribunali federali: interpretare e applicare il diritto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Due divisioni del potere</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Territorio e funzioni non sono la stessa cosa</text><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Livello federale</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Competenze comuni: moneta, commercio</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">interstatale, difesa.</text><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Livello degli Stati</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Ampi ambiti interni e istituzioni statali;</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">poteri riservati.</text><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Regola comune</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Supremazia della Costituzione e delle leggi</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">federali conformi a essa.</text><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Legislativo</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Congresso: Camera e Senato.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Esecutivo</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Presidente: mandato quadriennale, elezione</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">tramite grandi elettori.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Giudiziario</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Corte Suprema e tribunali federali:</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">interpretare e applicare il diritto.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>