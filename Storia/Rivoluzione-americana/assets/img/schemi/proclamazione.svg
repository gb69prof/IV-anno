<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">1763: il limite all’espansione</title><desc id="desc">Corona britannica: Contenere guerre e spese; governare terre e acquisizioni dopo la vittoria. Coloni e investitori: Accedere alle terre oltre gli Appalachi: coltivazione, insediamento e speculazione. Nazioni native: Difendere territori e sovranità; non sono un unico blocco politico. Royal Proclamation: Limite agli insediamenti oltre la linea; acquisti delle terre sotto controllo della Corona. Limiti effettivi: La linea è violata e contestata; una norma non coincide con il controllo reale. Questione storica: La libertà di espansione del colono può negare la libertà territoriale di un’altra comunità.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">1763: il limite all’espansione</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Tre soggetti, tre interessi in conflitto</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Corona britannica</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Contenere guerre e spese; governare terre e</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">acquisizioni dopo la vittoria.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Coloni e investitori</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Accedere alle terre oltre gli Appalachi:</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">coltivazione, insediamento e speculazione.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Nazioni native</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Difendere territori e sovranità; non sono</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">un unico blocco politico.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Royal Proclamation</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Limite agli insediamenti oltre la linea;</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">acquisti delle terre sotto controllo della</text><text x="638" y="537" font-family="sans-serif" font-size="22" fill="#233b48">Corona.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Limiti effettivi</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">La linea è violata e contestata; una norma</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">non coincide con il controllo reale.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Questione storica</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">La libertà di espansione del colono può</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">negare la libertà territoriale di un’altra</text><text x="638" y="752" font-family="sans-serif" font-size="22" fill="#233b48">comunità.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>