<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Confederazione / Federazione</title><desc id="desc">Entrate · Articoli: Il centro dipende dai contributi richiesti agli Stati. Entrate · Costituzione: Il Congresso ottiene un autonomo potere federale di imposizione. Rappresentanza · Articoli: Congresso con un voto per Stato. Rappresentanza · Costituzione: Camera legata alla popolazione; Senato con due membri per Stato. Esecutivo · Articoli: Nessuna presidenza federale separata come quella del nuovo ordinamento. Esecutivo · Costituzione: Presidente distinto dal Congresso; poteri sottoposti a controlli.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Confederazione / Federazione</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Confronto fra Articoli e Costituzione</text><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Entrate · Articoli</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Il centro dipende dai contributi richiesti</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">agli Stati.</text><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Entrate · Costituzione</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Il Congresso ottiene un autonomo potere</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">federale di imposizione.</text><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Rappresentanza · Articoli</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Congresso con un voto per Stato.</text><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Rappresentanza · Costituzione</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Camera legata alla popolazione; Senato con</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">due membri per Stato.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Esecutivo · Articoli</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Nessuna presidenza federale separata come</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">quella del nuovo ordinamento.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Esecutivo · Costituzione</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Presidente distinto dal Congresso; poteri</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">sottoposti a controlli.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>