<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Il paradosso del tè</title><desc id="desc">Tea Act · 1773: Privilegi alla East India Company; possibilità di vendere a prezzi competitivi. Dazio precedente: Il dazio sul tè rimane: non viene introdotta una nuova tassa. Opposizioni convergenti: Mercanti esclusi e contestatori dell’autorità parlamentare. 16 dicembre · Boston: Distruzione dei carichi. Alcuni usano simboli e travestimenti associati ai Mohawk. Coercive Acts · 1774: Londra punisce Boston e il Massachusetts. Risposta comune: La repressione favorisce coordinamento e Primo Congresso continentale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Il paradosso del tè</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">1773–1774 · Prezzo, commercio e sovranità</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Tea Act · 1773</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Privilegi alla East India Company;</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">possibilità di vendere a prezzi</text><text x="83" y="322" font-family="sans-serif" font-size="22" fill="#233b48">competitivi.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Dazio precedente</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Il dazio sul tè rimane: non viene</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">introdotta una nuova tassa.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Opposizioni convergenti</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Mercanti esclusi e contestatori</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">dell’autorità parlamentare.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">16 dicembre · Boston</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Distruzione dei carichi. Alcuni usano</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">simboli e travestimenti associati ai</text><text x="638" y="537" font-family="sans-serif" font-size="22" fill="#233b48">Mohawk.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Coercive Acts · 1774</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Londra punisce Boston e il Massachusetts.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Risposta comune</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">La repressione favorisce coordinamento e</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">Primo Congresso continentale.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>