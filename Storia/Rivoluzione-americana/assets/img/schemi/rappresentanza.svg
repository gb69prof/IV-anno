<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Chi può decidere le imposte?</title><desc id="desc">Parlamento britannico: Rappresentanza virtuale: i deputati curano gli interessi dell’intero impero. Assemblee coloniali: Consenso dei rappresentanti locali: chi non elegge Westminster ne contesta il prelievo. Il conflitto visibile: Tasse, dazi, controlli e boicottaggi. Il conflitto costituzionale: Quale corpo politico possiede l’autorità ultima? Il limite della richiesta: Rappresentanza locale non significa suffragio universale. Prova di comprensione: Una tassa ridotta risolverebbe da sola la disputa sull’autorità?</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Chi può decidere le imposte?</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Due idee di rappresentanza</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Parlamento britannico</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Rappresentanza virtuale: i deputati curano</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">gli interessi dell’intero impero.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Assemblee coloniali</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Consenso dei rappresentanti locali: chi non</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">elegge Westminster ne contesta il prelievo.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Il conflitto visibile</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Tasse, dazi, controlli e boicottaggi.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Il conflitto costituzionale</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Quale corpo politico possiede l’autorità</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">ultima?</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Il limite della richiesta</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Rappresentanza locale non significa</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">suffragio universale.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Prova di comprensione</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Una tassa ridotta risolverebbe da sola la</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">disputa sull’autorità?</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>