<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Cause → protesta → rottura</title><desc id="desc">1763 · Costi dell’impero: Debito di guerra e spese di difesa spingono Londra a cercare entrate coloniali. 1764–1767 · Provvedimenti: Sugar Act, Stamp Act, Townshend Acts: strumenti diversi di prelievo e controllo. Rappresentanza contesa: Westminster invoca la rappresentanza virtuale; i coloni rivendicano il consenso locale. Boicottaggi e tensioni: Organizzazione, proteste e repressione; Boston Massacre nel 1770. 1773 · Tea Act: Nessuna nuova tassa: dazio mantenuto e privilegi commerciali alla East India Company. 1774 · Coordinamento: Coercive Acts dopo il Tea Party; dodici colonie al Primo Congresso continentale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Cause → protesta → rottura</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Non soltanto quanto pagare: chi può imporre?</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1763 · Costi dell’impero</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Debito di guerra e spese di difesa spingono</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">Londra a cercare entrate coloniali.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1764–1767 · Provvedimenti</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Sugar Act, Stamp Act, Townshend Acts:</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">strumenti diversi di prelievo e controllo.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Rappresentanza contesa</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Westminster invoca la rappresentanza</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">virtuale; i coloni rivendicano il consenso</text><text x="83" y="537" font-family="sans-serif" font-size="22" fill="#233b48">locale.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Boicottaggi e tensioni</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Organizzazione, proteste e repressione;</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">Boston Massacre nel 1770.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1773 · Tea Act</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Nessuna nuova tassa: dazio mantenuto e</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">privilegi commerciali alla East India</text><text x="83" y="752" font-family="sans-serif" font-size="22" fill="#233b48">Company.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1774 · Coordinamento</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Coercive Acts dopo il Tea Party; dodici</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">colonie al Primo Congresso continentale.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>