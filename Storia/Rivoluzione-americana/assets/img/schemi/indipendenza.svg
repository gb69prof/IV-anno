<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Dalla protesta alla separazione</title><desc id="desc">Aprile 1775 · Si combatte: Lexington e Concord: la violenza armata precede la Dichiarazione. Maggio–giugno 1775: Secondo Congresso, esercito continentale, Washington al comando. Riconciliazione fallita: La guerra e il fallimento dei tentativi di accordo restringono le alternative. Gennaio 1776 · Paine: Common Sense attacca la monarchia ereditaria e difende l’indipendenza. Luglio 1776 · Due atti: 2 luglio: scelta della separazione. 4 luglio: approvazione della Dichiarazione. Nuova legittimità: Diritti naturali → consenso → diritto di cambiare governo. Applicazione ancora limitata.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Dalla protesta alla separazione</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">1775–1776 · Un esito costruito nel conflitto</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Aprile 1775 · Si combatte</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Lexington e Concord: la violenza armata</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">precede la Dichiarazione.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Maggio–giugno 1775</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Secondo Congresso, esercito continentale,</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">Washington al comando.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Riconciliazione fallita</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">La guerra e il fallimento dei tentativi di</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">accordo restringono le alternative.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Gennaio 1776 · Paine</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Common Sense attacca la monarchia</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">ereditaria e difende l’indipendenza.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Luglio 1776 · Due atti</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">2 luglio: scelta della separazione. 4</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">luglio: approvazione della Dichiarazione.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Nuova legittimità</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Diritti naturali → consenso → diritto di</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">cambiare governo. Applicazione ancora</text><text x="638" y="752" font-family="sans-serif" font-size="22" fill="#233b48">limitata.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>