<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Libertà per chi?</title><desc id="desc">Il principio: Uguaglianza, diritti naturali, consenso dei governati. Persone schiavizzate: La schiavitù continua; gli esclusi utilizzano anche il linguaggio rivoluzionario. Donne: Partecipazione sociale e politica senza accesso generale alla rappresentanza. Nazioni native: Sovranità territoriale minacciata dall’espansione degli insediamenti. Voto e cittadinanza: Requisiti variabili per Stato; nessun suffragio universale. Eccezioni locali da contestualizzare. Un problema storico: Le promesse possono diventare strumenti di rivendicazione oltre le intenzioni dei fondatori.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Libertà per chi?</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Il principio universale e le sue applicazioni limitate</text><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Il principio</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Uguaglianza, diritti naturali, consenso dei</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">governati.</text><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" 