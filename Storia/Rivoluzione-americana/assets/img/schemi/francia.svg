<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Perché l’intervento francese conta</title><desc id="desc">Motivazioni: Indebolire la Gran Bretagna e recuperare prestigio e influenza. Risorse: Finanziamenti, armi e forniture sostengono la resistenza. Esercito: Rochambeau guida il corpo di spedizione francese. Marina: La flotta di de Grasse limita le vie di soccorso britanniche nel Chesapeake. Yorktown · 1781: Washington e gli alleati cooperano nell’assedio; Cornwallis si arrende. Conseguenze: Il costo della guerra pesa sulle finanze francesi, dentro una crisi con molte cause.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Perché l’intervento francese conta</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Interessi imperiali e causa americana convergono</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Motivazioni</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Indebolire la Gran Bretagna e recuperare</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">prestigio e influenza.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Risorse</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Finanziamenti, armi e forniture sostengono</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">la resistenza.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Esercito</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Rochambeau guida il corpo di spedizione</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">francese.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Marina</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">La flotta di de Grasse limita le vie di</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">soccorso britanniche nel Chesapeake.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Yorktown · 1781</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Washington e gli alleati cooperano</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">nell’assedio; Cornwallis si arrende.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Conseguenze</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Il costo della guerra pesa sulle finanze</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">francesi, dentro una crisi con molte cause.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>