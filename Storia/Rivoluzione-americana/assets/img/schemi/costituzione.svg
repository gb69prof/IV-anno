<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Inventare una repubblica</title><desc id="desc">Confederazione: Articoli approvati nel 1777, in vigore dal 1781: forte autonomia degli Stati. Crisi del centro: Entrate e coordinamento deboli; conflitti economici e Shays’ Rebellion. 1787 · Convenzione: Firma della Costituzione il 17 settembre: repubblica costituzionale federale. Poteri e controlli: Congresso, Presidenza, giudici; competenze federali e statali; controlli reciproci. 1788–1789 · Attuazione: Nona ratifica nel 1788; nuovo governo nel 1789. Partecipazione politica limitata. 1789–1791 · Diritti: Proposta degli emendamenti nel 1789; dieci ratificati nel 1791: Bill of Rights.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Inventare una repubblica</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">1781–1791 · Efficacia del governo e limiti del potere</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Confederazione</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Articoli approvati nel 1777, in vigore dal</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">1781: forte autonomia degli Stati.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Crisi del centro</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Entrate e coordinamento deboli; conflitti</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">economici e Shays’ Rebellion.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1787 · Convenzione</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Firma della Costituzione il 17 settembre:</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">repubblica costituzionale federale.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Poteri e controlli</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Congresso, Presidenza, giudici; competenze</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">federali e statali; controlli reciproci.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1788–1789 · Attuazione</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Nona ratifica nel 1788; nuovo governo nel</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">1789. Partecipazione politica limitata.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1789–1791 · Diritti</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Proposta degli emendamenti nel 1789; dieci</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">ratificati nel 1791: Bill of Rights.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>