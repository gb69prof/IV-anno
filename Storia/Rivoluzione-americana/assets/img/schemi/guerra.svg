<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Una rivoluzione internazionale</title><desc id="desc">1775–1776 · Resistenza: Scarsità di denaro e rifornimenti; l’esercito deve sopravvivere alle sconfitte. 1777 · Saratoga: La resa di Burgoyne dimostra la capacità militare dei ribelli. 1778 · Alleanza francese: Franklin e la diplomazia; interessi francesi contro la Gran Bretagna. Guerra su più fronti: Francia: denaro, truppe e flotta. Spagna in guerra nel 1779, separatamente. 1781 · Yorktown: Cooperazione franco-americana; si arrende l’esercito di Cornwallis. 1783 · Trattato di Parigi: Londra riconosce l’indipendenza. Le nazioni native non partecipano al trattato.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Una rivoluzione internazionale</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Resistere, ottenere alleati, conquistare la pace</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1775–1776 · Resistenza</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Scarsità di denaro e rifornimenti;</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">l’esercito deve sopravvivere alle</text><text x="83" y="322" font-family="sans-serif" font-size="22" fill="#233b48">sconfitte.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1777 · Saratoga</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">La resa di Burgoyne dimostra la capacità</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">militare dei ribelli.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1778 · Alleanza francese</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Franklin e la diplomazia; interessi</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">francesi contro la Gran Bretagna.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Guerra su più fronti</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Francia: denaro, truppe e flotta. Spagna in</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">guerra nel 1779, separatamente.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1781 · Yorktown</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Cooperazione franco-americana; si arrende</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">l’esercito di Cornwallis.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">1783 · Trattato di Parigi</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Londra riconosce l’indipendenza. Le nazioni</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">native non partecipano al trattato.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>