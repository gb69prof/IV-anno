<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Economie regionali, reti comuni</title><desc id="desc">New England: Piccole aziende, pesca, cantieri, commercio e porti; lavoro libero e schiavizzato. Colonie centrali: Cereali, aziende agricole, artigianato e porti; popolazione e confessioni plurali. Colonie meridionali: Tabacco, riso e indaco; nelle piantagioni è centrale il lavoro schiavizzato. Il sistema atlantico: Mercanti e porti settentrionali partecipano agli scambi di prodotti delle piantagioni. Una presenza comune: La schiavitù africana è legalmente riconosciuta in tutte le tredici colonie. Attenzione alla cronologia: Il grande sviluppo del cotone appartiene soprattutto a una fase successiva.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Economie regionali, reti comuni</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Differenze di peso, non mondi separati</text><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">New England</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Piccole aziende, pesca, cantieri, commercio</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">e porti; lavoro libero e schiavizzato.</text><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Colonie centrali</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Cereali, aziende agricole, artigianato e</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">porti; popolazione e confessioni plurali.</text><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Colonie meridionali</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Tabacco, riso e indaco; nelle piantagioni è</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">centrale il lavoro schiavizzato.</text><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Il sistema atlantico</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Mercanti e porti settentrionali partecipano</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">agli scambi di prodotti delle piantagioni.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Una presenza comune</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">La schiavitù africana è legalmente</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">riconosciuta in tutte le tredici colonie.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Attenzione alla cronologia</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Il grande sviluppo del cotone appartiene</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">soprattutto a una fase successiva.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>