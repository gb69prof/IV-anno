<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">I teatri essenziali della guerra</title><desc id="desc">Carta schematica della costa orientale nordamericana. Posizioni approssimative, senza confini coloniali. Consulta la legenda testuale nella PWA.</desc><rect width="1200" height="880" fill="#e1edf0"/><polygon points="0,120 964,120 236,740 236,701 288,662 340,623 392,584 496,545 516.8000000000003,506 496,467 496,428 548,389 600,350 652,311 756,311 808,272 756,233 808,194 860,155 964,155 0,800" fill="#eee5cc"/><polyline points="236,740 236,701 288,662 340,623 392,584 496,545 516.8000000000003,506 496,467 496,428 548,389 600,350 652,311 756,311 808,272 756,233 808,194 860,155 964,155" fill="none" stroke="#496371" stroke-width="3"/><rect width="1200" height="110" fill="#152f43"/><text x="40" y="49" fill="#fffaf0" font-family="Georgia" font-size="35">I teatri essenziali della guerra</text><text x="40" y="85" fill="#eee5cc" font-family="sans-serif" font-size="19">Carta schematica · Posizioni approssimative · Confini non rappresentati</text><text x="820" y="690" font-family="Georgia" font-style="italic" fill="#36586a" font-size="28">Oceano Atlantico</text><text x="45" y="166" font-family="sans-serif" fill="#203f4a" font-size="25">N ↑</text><circle cx="753.4000000000001" cy="258.34999999999997" r="15" fill="#823d32"/><text x="753.4000000000001" y="264.34999999999997" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">1</text><text x="795" y="185" fill="#152f43" font-size="23" font-family="sans-serif">1 · Boston · 1775–1776</text><circle cx="600" cy="322.6999999999999" r="15" fill="#823d32"/><text x="600" y="328.6999999999999" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">2</text><text x="795" y="239" fill="#152f43" font-size="23" font-family="sans-serif">2 · New York · 1776</text><circle cx="620.8000000000003" cy="233" r="15" fill="#823d32"/><text x="620.8000000000003" y="239" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">3</text><text x="795" y="293" fill="#152f43" font-size="23" font-family="sans-serif">3 · Saratoga · 1777</text><circle cx="293.1999999999997" cy="630.8000000000001" r="15" fill="#823d32"/><text x="293.1999999999997" y="636.8000000000001" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">4</text><text x="795" y="347" fill="#152f43" font-size="23" font-family="sans-serif">4 · Charleston · 1780</text><circle cx="470.0" cy="459.1999999999999" r="15" fill="#823d32"/><text x="470.0" y="465.1999999999999" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">5</text><text x="795" y="401" fill="#152f43" font-size="23" font-family="sans-serif">5 · Yorktown · 1781</text><path d="M1050 630 Q930 450 510 465" stroke="#163b51" stroke-width="4" fill="none" stroke-dasharray="12 8"/><text x="695" y="610" fill="#163b51" font-size="21" font-family="sans-serif">Intervento navale francese</text><rect x="0" y="775" width="1200" height="105" fill="#fffdf8"/><text x="35" y="805" fill="#203f4a" font-family="sans-serif" font-size="20">Teatri essenziali: New England nel 1775–1776; New York nel 1776; Saratoga nel 1777; offensiva meridionale e</text><text x="35" y="831" fill="#203f4a" font-family="sans-serif" font-size="20">Charleston nel 1780; Yorktown nel 1781. La traccia dal mare indica simbolicamente il contributo navale</text><text x="35" y="857" fill="#203f4a" font-family="sans-serif" font-size="20">francese, non una rotta precisa. La carta non rappresenta tutte le campagne.</text></svg>