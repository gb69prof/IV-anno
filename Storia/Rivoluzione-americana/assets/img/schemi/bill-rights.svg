<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Bill of Rights: dieci emendamenti</title><desc id="desc">I · Libertà pubbliche: Religione, parola, stampa, riunione e petizione. II–III · Armi e soldati: Armi nel contesto anche della milizia; limiti all’alloggiamento dei soldati. IV · Perquisizioni: Protezione contro perquisizioni e sequestri irragionevoli. V–VIII · Giustizia: Garanzie processuali, giuria nei casi previsti, limiti alle pene. IX–X · Diritti e poteri: Diritti non esauriti dall’elenco; poteri riservati agli Stati o al popolo. Limiti originari: Garanzie verso il governo federale; nessuna abolizione generale della schiavitù.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Bill of Rights: dieci emendamenti</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Proposti nel 1789 · Ratificati nel 1791</text><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">I · Libertà pubbliche</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Religione, parola, stampa, riunione e</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">petizione.</text><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">II–III · Armi e soldati</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Armi nel contesto anche della milizia;</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">limiti all’alloggiamento dei soldati.</text><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">IV · Perquisizioni</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Protezione contro perquisizioni e sequestri</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">irragionevoli.</text><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">V–VIII · Giustizia</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Garanzie processuali, giuria nei casi</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">previsti, limiti alle pene.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">IX–X · Diritti e poteri</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Diritti non esauriti dall’elenco; poteri</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">riservati agli Stati o al popolo.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Limiti originari</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Garanzie verso il governo federale; nessuna</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">abolizione generale della schiavitù.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>