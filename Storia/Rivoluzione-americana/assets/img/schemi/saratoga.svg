<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Da Saratoga all’alleanza</title><desc id="desc">Obiettivo britannico: Separare il New England attraverso il corridoio Champlain–Hudson. Difficoltà di Burgoyne: Resistenza americana, coordinamento e rifornimenti problematici. 17 ottobre 1777: Resa britannica a Saratoga: la guerra non è conclusa. Credibilità americana: La vittoria rende più plausibile la durata della resistenza. Diplomazia: Franklin e gli altri negoziatori operano presso la monarchia francese. 6 febbraio 1778: Trattati di commercio e alleanza: l’intervento francese diviene aperto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93672c"/></marker></defs><rect width="1200" height="920" fill="#f6f0e2"/><text x="60" y="56" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#75412d">GBPROF · RIVOLUZIONE AMERICANA</text><text x="60" y="109" font-family="Georgia,serif" font-size="38" fill="#152f43">Da Saratoga all’alleanza</text><text x="60" y="147" font-family="sans-serif" font-size="21" fill="#485966">Una vittoria cambia il calcolo del rischio</text><path d="M307 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="195" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Obiettivo britannico</text><text x="83" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Separare il New England attraverso il</text><text x="83" y="295" font-family="sans-serif" font-size="22" fill="#233b48">corridoio Champlain–Hudson.</text><path d="M862 370v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="195" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="195" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Difficoltà di Burgoyne</text><text x="638" y="268" font-family="sans-serif" font-size="22" fill="#233b48">Resistenza americana, coordinamento e</text><text x="638" y="295" font-family="sans-serif" font-size="22" fill="#233b48">rifornimenti problematici.</text><path d="M307 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="410" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">17 ottobre 1777</text><text x="83" y="483" font-family="sans-serif" font-size="22" fill="#233b48">Resa britannica a Saratoga: la guerra non è</text><text x="83" y="510" font-family="sans-serif" font-size="22" fill="#233b48">conclusa.</text><path d="M862 585v35" stroke="#93672c" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="410" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="410" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="447" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Credibilità americana</text><text x="638" y="483" font-family="sans-serif" font-size="22" fill="#233b48">La vittoria rende più plausibile la durata</text><text x="638" y="510" font-family="sans-serif" font-size="22" fill="#233b48">della resistenza.</text><rect x="60" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="60" y="625" width="7" height="175" rx="3" fill="#163b51"/><text x="83" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">Diplomazia</text><text x="83" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Franklin e gli altri negoziatori operano</text><text x="83" y="725" font-family="sans-serif" font-size="22" fill="#233b48">presso la monarchia francese.</text><rect x="615" y="625" width="525" height="175" rx="12" fill="#fffdf8" stroke="#ac9875"/><rect x="615" y="625" width="7" height="175" rx="3" fill="#823d32"/><text x="638" y="662" font-family="sans-serif" font-weight="700" font-size="22" fill="#152f43">6 febbraio 1778</text><text x="638" y="698" font-family="sans-serif" font-size="22" fill="#233b48">Trattati di commercio e alleanza:</text><text x="638" y="725" font-family="sans-serif" font-size="22" fill="#233b48">l’intervento francese diviene aperto.</text><text x="60" y="890" font-family="sans-serif" font-size="18" fill="#485966">Schema originale · Leggi il testo della lezione per nessi, contesto e fonti.</text></svg>