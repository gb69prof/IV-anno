f" font-size="21" fill="#163b51">2 · Massachusetts</text><text x="852" y="225" font-family="sans-serif" font-size="21" fill="#163b51">3 · Rhode Island</text><text x="852" y="255" font-family="sans-serif" font-size="21" fill="#163b51">4 · Connecticut</text><text x="852" y="285" font-family="sans-serif" font-size="21" fill="#665625">5 · New York</text><text x="852" y="315" font-family="sans-serif" font-size="21" fill="#665625">6 · New Jersey</text><text x="852" y="345" font-family="sans-serif" font-size="21" fill="#665625">7 · Pennsylvania</text><text x="852" y="375" font-family="sans-serif" font-size="21" fill="#665625">8 · Delaware</text><text x="852" y="405" font-family="sans-serif" font-size="21" fill="#823d32">9 · Maryland</text><text x="852" y="435" font-family="sans-serif" font-size="21" fill="#823d32">10 · Virginia</text><text x="852" y="465" font-family="sans-serif" font-size="21" fill="#823d32">11 · North Carolina</text><text x="852" y="495" font-family="sans-serif" font-size="21" fill="#823d32">12 · South Carolina</text><text x="852" y="525" font-family="sans-serif" font-size="21" fill="#823d32">13 · Georgia</text><text x="840" y="575" font-family="sans-serif" font-size="16" fill="#203f4a">Il Maine fa parte del Massachusetts.</text><path d="M660 205 Q430 430 285 715" stroke="#805a32" stroke-width="5" fill="none" stroke-dasharray="10 8"/><text x="125" y="480" fill="#634729" font-family="sans-serif" font-size="23">Appalachi</text><rect x="0" y="775" width="1200" height="105" fill="#fffdf8"/><text x="35" y="805" fill="#203f4a" font-family="sans-serif" font-size="20">Tredici colonie raggruppate in New England (1–4), Centro (5–8), Sud (9–13). Il Maine fa parte del</text><text x="35" y="831" fill="#203f4a" font-family="sans-serif" font-size="20">Massachusetts. I punti localizzano le colonie senza disegnarne i confini; la traccia degli Appalachi è</text><text x="35" y="857" fill="#203f4a" font-family="sans-serif" font-size="20">indicativa. Le terre a ovest sono abitate da nazioni native, non spazi vuoti.</text></svg>