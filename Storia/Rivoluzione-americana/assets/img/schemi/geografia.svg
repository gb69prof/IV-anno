<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Le tredici colonie sulla costa atlantica</title><desc id="desc">Carta schematica della costa orientale nordamericana. Posizioni approssimative, senza confini coloniali. Consulta la legenda testuale nella PWA.</desc><rect width="1200" height="880" fill="#e1edf0"/><polygon points="0,120 964,120 236,740 236,701 288,662 340,623 392,584 496,545 516.8000000000003,506 496,467 496,428 548,389 600,350 652,311 756,311 808,272 756,233 808,194 860,155 964,155 0,800" fill="#eee5cc"/><polyline points="236,740 236,701 288,662 340,623 392,584 496,545 516.8000000000003,506 496,467 496,428 548,389 600,350 652,311 756,311 808,272 756,233 808,194 860,155 964,155" fill="none" stroke="#496371" stroke-width="3"/><rect width="1200" height="110" fill="#152f43"/><text x="40" y="49" fill="#fffaf0" font-family="Georgia" font-size="35">Le tredici colonie sulla costa atlantica</text><text x="40" y="85" fill="#eee5cc" font-family="sans-serif" font-size="19">Carta schematica · Posizioni approssimative · Confini non rappresentati</text><text x="820" y="690" font-family="Georgia" font-style="italic" fill="#36586a" font-size="28">Oceano Atlantico</text><text x="45" y="166" font-family="sans-serif" fill="#203f4a" font-size="25">N ↑</text><circle cx="724.8000000000003" cy="209.5999999999999" r="16" fill="#163b51"/><text x="724.8000000000003" y="215.5999999999999" text-anchor="middle" fill="white" font-size="17" font-family="sans-serif">1</text><circle cx="730.0" cy="260.3000000000001" r="16" fill="#163b51"/><text x="730.0" y="266.3000000000001" text-anchor="middle" fill="white" font-size="17" font-family="sans-serif">2</text><circle cx="735.1999999999997" cy="291.5" r="16" fill="#163b51"/><text x="735.1999999999997" y="297.5" text-anchor="middle" fill="white" font-size="17" font-family="sans-serif">3</text><circle cx="672.8000000000003" cy="287.59999999999997" r="16" fill="#163b51"/>