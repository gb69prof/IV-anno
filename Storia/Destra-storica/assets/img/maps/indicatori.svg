<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Indicatori territoriali nell'Italia postunitaria</title><desc id="d">Grafici su alfabetizzazione, scuola e ferrovie con avvertenze metodologiche</desc><rect width="1100" height="760" fill="#f4efe5"/><text x="48" y="58" font-family="Georgia,serif" font-size="36" fill="#293a32">I dati correggono gli slogan, non parlano da soli</text><g transform="translate(65 120)" font-family="system-ui" fill="#293a32"><text font-family="Georgia,serif" font-size="27">Alfabetizzazione sopra i 15 anni, circa 1861</text><text y="34" font-size="16" fill="#687069">Stima comparativa Bastasin-Toniolo 2023</text><text y="85" font-size="19">Nord-Ovest</text><rect x="140" y="60" width="480" height="32" rx="16" fill="#ddd4c3"/><rect x="140" y="60" width="230" height="32" rx="16" fill="#53685c"/><text x="385" y="84" font-size="20" font-weight="850">48%</text><text y="140" font-size="19">Mezzogiorno</text><rect x="140" y="115" width="480" height="32" rx="16" fill="#ddd4c3"/><rect x="140" y="115" width="72" height="32" rx="16" fill="#8f493c"/><text x="226" y="139" font-size="20" font-weight="850">15%</text><path d="M0 190h970" stroke="#cbbd9f" stroke-width="2"/><text y="240" font-family="Georgia,serif" font-size="27">Accesso e infrastrutture nazionali</text><g transform="translate(0 280)"><rect width="285" height="145" rx="15" fill="#fffaf0" stroke="#cbbd9f" stroke-width="2"/><text x="22" y="38" font-size="17" font-weight="800">Iscritti 5-19 anni</text><text x="22" y="92" font-family="Georgia,serif" font-size="45" fill="#8f493c">15,7%</text><text x="22" y="120" font-size="15" fill="#687069">Italia, censimento 1861</text></g><g transform="translate(325 280)"><rect width="285" height="145" rx="15" fill="#fffaf0" stroke="#cbbd9f" stroke-width="2"/><text x="22" y="38" font-size="17" font-weight="800">Rete ferroviaria 1861</text><text x="22" y="92" font-family="Georgia,serif" font-size="45" fill="#53685c">≈ 2.189 km</text><text x="22" y="120" font-size="15" fill="#687069">frammentata e diseguale</text></g><g transform="translate(650 280)"><rect width="285" height="145" rx="15" fill="#fffaf0" stroke="#cbbd9f" stroke-width="2"/><text x="22" y="38" font-size="17" font-weight="800">Rete ferroviaria 1870</text><text x="22" y="92" font-family="Georgia,serif" font-size="45" fill="#ba9554">≈ 6.429 km</text><text x="22" y="120" font-size="15" fill="#687069">espansione, non parità</text></g><rect y="470" width="970" height="105" rx="16" fill="#293a32"/><text x="24" y="505" fill="#fff" font-size="19" font-weight="850">Limite di lettura</text><text x="24" y="538" fill="#e5ece7" font-size="17">Denominatori, confini e criteri cambiano. Le medie macroregionali nascondono differenze interne.</text><text x="24" y="566" fill="#e5ece7" font-size="17">Questi indicatori non misurano da soli reddito, benessere o capacità produttiva.</text></g><text x="48" y="724" font-family="system-ui" font-size="17" fill="#687069">Fonti: Istat, censimento 1861 e moduli storici; Bastasin-Toniolo, Cambridge UP 2023; serie ferroviarie storiche Istat.</text></svg>
