<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Principali aree del brigantaggio postunitario</title><desc id="d">Carta schematica delle aree interne del Mezzogiorno continentale interessate con maggiore continuità</desc><rect width="1100" height="760" fill="#f4efe5"/><text x="48" y="58" font-family="Georgia,serif" font-size="36" fill="#293a32">1861-1865: una geografia mobile</text><g transform="translate(135 85) scale(.78)"><path d="M170 0l104 28 48 116-18 74-30 79 48 78 54 86-91 64 62 99-69 82-119-139-89-110-59-139 45-95-47-91z" fill="#d9c9a8" stroke="#293a32" stroke-width="8"/><path d="M111 720l143-35 152 49-62 76-195 9z" fill="#d9c9a8" stroke="#293a32" stroke-width="8"/><path d="M257 355l69 27 50 79-83 65 54 98-66 79-109-126-67-93 53-73z" fill="#8f493c" opacity=".72"/><g fill="#ba9554" stroke="#293a32" stroke-width="5"><circle cx="292" cy="407" r="17"/><circle cx="252" cy="475" r="17"/><circle cx="308" cy="528" r="17"/><circle cx="235" cy="575" r="17"/><circle cx="290" cy="630" r="17"/></g></g><g transform="translate(600 140)" font-family="system-ui" fill="#293a32"><text font-family="Georgia,serif" font-size="30">Aree ricorrenti</text><g font-size="20"><circle cy="63" r="11" fill="#ba9554"/><text x="28" y="70">Basilicata e Vulture-Melfese</text><circle cy="112" r="11" fill="#ba9554"/><text x="28" y="119">Capitanata e Irpinia</text><circle cy="161" r="11" fill="#ba9554"/><text x="28" y="168">Terra di Lavoro e Abruzzi interni</text><circle cy="210" r="11" fill="#ba9554"/><text x="28" y="217">Calabrie e aree appenniniche</text></g><path d="M0 260h390" stroke="#cbbd9f" stroke-width="2"/><text y="306" font-size="19" font-weight="800">La campitura non significa:</text><text y="342" font-size="18">• controllo continuo delle bande</text><text y="377" font-size="18">• confine politico o fronte stabile</text><text y="412" font-size="18">• identica intensità in ogni anno</text><text y="475" font-size="19" font-weight="800">Significa:</text><text y="511" font-size="18">ricorrenza documentata di bande, scontri,</text><text y="544" font-size="18">reti di sostegno e repressione militare.</text></g><text x="48" y="724" font-family="system-ui" font-size="17" fill="#687069">Sintesi cartografica originale da documentazione parlamentare e studi di Salvatore Lupo, Carmine Pinto e John A. Davis.</text></svg>
