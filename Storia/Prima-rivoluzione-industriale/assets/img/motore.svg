<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="t d"><title id="t">Dal calore al movimento</title><desc id="d">Schema semplificato di sistema rotativo con condensazione separata.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#93672c"/></marker></defs><rect width="1400" height="1000" fill="#f6f0e2"/><text x="55" y="45" fill="#823d32" font-family="Arial,sans-serif" font-size="20"><tspan x="55" dy="0">PRIMA RIVOLUZIONE INDUSTRIALE · gbprof e Libera</tspan></text><text x="55" y="105" fill="#152f43" font-family="Arial,sans-serif" font-size="38"><tspan x="55" dy="0">Dal calore al movimento</tspan></text><rect x="55" y="200" width="380" height="140" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="77" y="242" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="77" dy="0">Carbone</tspan></text><text x="77" y="286" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="77" dy="0">Combustibile: energia</tspan><tspan x="77" dy="33.599999999999994">chimica.</tspan></text><path d="M435 270L505 270" stroke="#93672c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="505" y="200" width="390" height="140" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="527" y="242" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="527" dy="0">Caldaia</tspan></text><text x="527" y="286" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="527" dy="0">Il calore produce vapore.</tspan></text><path d="M895 270L965 270" stroke="#93672c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="965" y="200" width="380" height="140" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="987" y="242" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="987" dy="0">Cilindro e pistone</tspan></text><text x="987" y="286" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="987" dy="0">Pressioni diverse generano</tspan><tspan x="987" dy="33.599999999999994">moto.</tspan></text><path d="M1155 340L1155 480" stroke="#93672c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1000" y="415" fill="#485966" font-family="Arial,sans-serif" font-size="21"><tspan x="1000" dy="0">movimento</tspan></text><rect x="790" y="480" width="555" height="160" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="812" y="522" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="812" dy="0">Trasmissione meccanica</tspan></text><text x="812" y="566" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="812" dy="0">Bilancieri, collegamenti e albero</tspan><tspan x="812" dy="33.599999999999994">rotante secondo il tipo di motore.</tspan></text><path d="M790 560L640 560" stroke="#93672c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="480" width="585" height="160" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="77" y="522" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="77" dy="0">Macchine operatrici</tspan></text><text x="77" y="566" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="77" dy="0">Usano il movimento: per esempio gli</tspan><tspan x="77" dy="33.599999999999994">apparati di una fabbrica.</tspan></text><path d="M1345 290H1380V760H1070" stroke="#93672c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="480" y="730" width="590" height="155" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="502" y="772" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="502" dy="0">Condensatore separato</tspan></text><text x="502" y="816" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="502" dy="0">Il vapore condensa fuori dal cilindro,</tspan><tspan x="502" dy="33.599999999999994">limitandone il raffreddamento ripetuto.</tspan></text><text x="1210" y="710" fill="#485966" font-family="Arial,sans-serif" font-size="22"><tspan x="1210" dy="0">vapore</tspan></text><text x="55" y="940" fill="#152f43" font-family="Arial,sans-serif" font-size="24"><tspan x="55" dy="0">Watt migliora un percorso già avviato: Newcomen usa prima una macchina atmosferica per pompe.</tspan></text></svg>