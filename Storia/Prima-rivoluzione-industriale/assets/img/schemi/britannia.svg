<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1160" role="img" aria-labelledby="t d"><title id="t">Perché in Gran Bretagna?</title><desc id="d">Agricoltura, commercio, risorse e saperi → creano opportunità di investimento → imprese in territori favorevoli → crescita selettiva e nuovi squilibri.</desc><rect width="1400" height="1160" fill="#f6f0e2"/><path d="M50 65H1350" stroke="#ad8d53" stroke-width="3"/><text x="65" y="45" fill="#823d32" font-family="Arial, sans-serif" font-size="21"><tspan x="65" dy="0">PRIMA RIVOLUZIONE INDUSTRIALE · MAPPA 2</tspan></text><rect x="260" y="100" width="880" height="150" rx="8" fill="#152f43"/><text x="305" y="152" fill="#fff7e6" font-family="Arial, sans-serif" font-size="38"><tspan x="305" dy="0">Perché in Gran Bretagna?</tspan></text><path d="M700 250V975" stroke="#ad8d53" stroke-width="4"/><path d="M700 415H635" stroke="#ad8d53" stroke-width="3"/><circle cx="700" cy="415" r="7" fill="#823d32"/><rect x="65" y="325" width="570" height="190" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="90" y="367" fill="#823d32" font-family="Arial, sans-serif" font-size="30"><tspan x="90" dy="0">Agricoltura</tspan></text><text x="90" y="427" fill="#203641" font-family="Arial, sans-serif" font-size="25"><tspan x="90" dy="0">Più mercato; cambiano gestione e</tspan><tspan x="90" dy="33.75">diritti.</tspan></text><path d="M700 415H765" stroke="#ad8d53" stroke-width="3"/><circle cx="700" cy="415" r="7" fill="#823d32"/><rect x="765" y="325" width="570" height="190" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="790" y="367" fill="#823d32" font-family="Arial, sans-serif" font-size="30"><tspan x="790" dy="0">Popolazione</tspan></text><text x="790" y="427" fill="#203641" font-family="Arial, sans-serif" font-size="25"><tspan x="790" dy="0">Crescono bisogni e disponibilità di</tspan><tspan x="790" dy="33.75">lavoro.</tspan></text><path d="M700 655H635" stroke="#ad8d53" stroke-width="3"/><circle cx="700" cy="655" r="7" fill="#823d32"/><rect x="65" y="565" width="570" height="190" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="90" y="607" fill="#823d32" font-family="Arial, sans-serif" font-size="30"><tspan x="90" dy="0">Commerci e credito</tspan></text><text x="90" y="667" fill="#203641" font-family="Arial, sans-serif" font-size="25"><tspan x="90" dy="0">Collegano materie prime, capitali e</tspan><tspan x="90" dy="33.75">clienti.</tspan></text><path d="M700 655H765" stroke="#ad8d53" stroke-width="3"/><circle cx="700" cy="655" r="7" fill="#823d32"/><rect x="765" y="565" width="570" height="190" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="790" y="607" fill="#823d32" font-family="Arial, sans-serif" font-size="30"><tspan x="790" dy="0">Energia e trasporti</tspan></text><text x="790" y="667" fill="#203641" font-family="Arial, sans-serif" font-size="25"><tspan x="790" dy="0">Carbone, acqua, porti e canali</tspan><tspan x="790" dy="33.75">riducono vincoli.</tspan></text><path d="M700 895H635" stroke="#ad8d53" stroke-width="3"/><circle cx="700" cy="895" r="7" fill="#823d32"/><rect x="65" y="805" width="570" height="190" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="90" y="847" fill="#823d32" font-family="Arial, sans-serif" font-size="30"><tspan x="90" dy="0">Competenze e istituzioni</tspan></text><text x="90" y="907" fill="#203641" font-family="Arial, sans-serif" font-size="25"><tspan x="90" dy="0">Officine, contratti e brevetti</tspan><tspan x="90" dy="33.75">sostengono progetti.</tspan></text><path d="M700 895H765" stroke="#ad8d53" stroke-width="3"/><circle cx="700" cy="895" r="7" fill="#823d32"/><rect x="765" y="805" width="570" height="190" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="790" y="847" fill="#823d32" font-family="Arial, sans-serif" font-size="30"><tspan x="790" dy="0">Combinazione territoriale</tspan></text><text x="790" y="907" fill="#203641" font-family="Arial, sans-serif" font-size="25"><tspan x="790" dy="0">I fattori interagiscono: nessuno basta</tspan><tspan x="790" dy="33.75">da solo.</tspan></text><text x="65" y="1090" fill="#485966" font-family="Arial, sans-serif" font-size="22"><tspan x="65" dy="0">Relazioni di studio: i rami sviluppano il problema centrale, non una successione automatica.</tspan></text><text x="65" y="1130" fill="#485966" font-family="Arial, sans-serif" font-size="20"><tspan x="65" dy="0">gbprof e Libera · Schema originale · Descrizione testuale nella PWA</tspan></text></svg>