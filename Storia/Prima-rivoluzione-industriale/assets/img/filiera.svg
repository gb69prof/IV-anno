<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="t d"><title id="t">Dal campo al tessuto</title><desc id="d">Filiera funzionale, con distinzione dei rapporti di lavoro.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#93672c"/></marker></defs><rect width="1400" height="1000" fill="#f6f0e2"/><text x="55" y="45" fill="#823d32" font-family="Arial,sans-serif" font-size="20"><tspan x="55" dy="0">PRIMA RIVOLUZIONE INDUSTRIALE · gbprof e Libera</tspan></text><text x="55" y="105" fill="#152f43" font-family="Arial,sans-serif" font-size="38"><tspan x="55" dy="0">Dal campo al tessuto</tspan></text><rect x="55" y="175" width="600" height="160" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="77" y="217" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="77" dy="0">1. Coltivazione e raccolta</tspan></text><text x="77" y="261" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="77" dy="0">Più regioni produttrici; nelle piantagioni</tspan><tspan x="77" dy="33.599999999999994">atlantiche anche lavoro schiavizzato.</tspan></text><rect x="745" y="175" width="600" height="160" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="767" y="217" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="767" dy="0">Mercati e poteri coloniali</tspan></text><text x="767" y="261" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="767" dy="0">L’India possiede una tradizione tessile</tspan><tspan x="767" dy="33.599999999999994">precedente; non è un mondo senza</tspan><tspan x="767" dy="33.599999999999994">industria.</tspan></text><path d="M355 335L355 410" stroke="#93672c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="370" y="372.5" fill="#485966" font-family="Arial,sans-serif" font-size="21"><tspan x="370" dy="0">fibra grezza</tspan></text><rect x="55" y="410" width="600" height="150" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="77" y="452" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="77" dy="0">2. Preparazione e trasporto</tspan></text><text x="77" y="496" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="77" dy="0">Separazione dei semi; porti, credito,</tspan><tspan x="77" dy="33.599999999999994">assicurazioni e magazzini.</tspan></text><path d="M655 485L745 485" stroke="#93672c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="745" y="410" width="600" height="150" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="767" y="452" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="767" dy="0">3. Filatura</tspan></text><text x="767" y="496" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="767" dy="0">Le fibre diventano filo. Nelle fabbriche</tspan><tspan x="767" dy="33.599999999999994">britanniche: lavoro salariato.</tspan></text><path d="M1045 560L1045 660" stroke="#93672c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1060" y="610.0" fill="#485966" font-family="Arial,sans-serif" font-size="21"><tspan x="1060" dy="0">filato</tspan></text><rect x="745" y="660" width="600" height="145" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="767" y="702" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="767" dy="0">4. Tessitura e finitura</tspan></text><text x="767" y="746" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="767" dy="0">I fili vengono intrecciati e la stoffa</tspan><tspan x="767" dy="33.599999999999994">rifinita.</tspan></text><path d="M745 733L655 733" stroke="#93672c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="660" width="600" height="145" rx="8" fill="#fffdf8" stroke="#c5b99f"/><text x="77" y="702" fill="#823d32" font-family="Arial,sans-serif" font-size="28"><tspan x="77" dy="0">5. Distribuzione e consumo</tspan></text><text x="77" y="746" fill="#203641" font-family="Arial,sans-serif" font-size="24"><tspan x="77" dy="0">Il tessuto raggiunge mercati interni ed</tspan><tspan x="77" dy="33.599999999999994">esteri; la domanda sostiene nuovi ordini.</tspan></text><text x="55" y="890" fill="#152f43" font-family="Arial,sans-serif" font-size="26"><tspan x="55" dy="0">La filiera connette condizioni diverse: schiavitù e lavoro salariato non sono sinonimi.</tspan></text><text x="55" y="950" fill="#485966" font-family="Arial,sans-serif" font-size="22"><tspan x="55" dy="0">Schema didattico originale. Le tappe non impongono un’unica rotta geografica.</tspan></text></svg>