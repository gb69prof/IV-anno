<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Le nuove forze sociali nell'Italia liberale</title><desc id="d">Rete tra Stato, radicali, socialisti, lavoratori organizzati e movimento cattolico.</desc>
  <rect width="1200" height="750" fill="#fffaf4"/><text x="70" y="82" fill="#352f4a" font-family="Georgia,serif" font-size="47">La società entra in politica da porte diverse</text>
  <g fill="none" stroke="#9a879f" stroke-width="5"><path d="M600 340 260 220M600 340 945 205M600 340 220 555M600 340 980 555"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="600" cy="340" r="125" fill="#352f4a"/><text x="600" y="326" fill="#fff" font-size="30" font-weight="700">STATO</text><text x="600" y="365" fill="#e3d8e7" font-size="21">riforma · integra</text><text x="600" y="395" fill="#e3d8e7" font-size="21">sorveglia · reprime</text>
  <rect x="85" y="135" width="350" height="145" rx="28" fill="#ead7dc" stroke="#a24f5f" stroke-width="3"/><text x="260" y="188" fill="#a24f5f" font-size="27" font-weight="700">RADICALI</text><text x="260" y="230" fill="#352f4a" font-size="21">suffragio · laicità · riforme</text>
  <rect x="770" y="120" width="350" height="165" rx="28" fill="#e6ddc8" stroke="#c49a55" stroke-width="3"/><text x="945" y="176" fill="#8c682f" font-size="27" font-weight="700">SOCIALISTI</text><text x="945" y="217" fill="#352f4a" font-size="18">dal moto alla politica organizzata</text><text x="945" y="249" fill="#352f4a" font-size="19">Andrea Costa · 1882</text>
  <rect x="45" y="485" width="350" height="150" rx="28" fill="#e2e7ee" stroke="#66768d" stroke-width="3"/><text x="220" y="540" fill="#51637c" font-size="27" font-weight="700">LAVORATORI</text><text x="220" y="583" fill="#352f4a" font-size="18">mutuo soccorso · leghe · scioperi</text>
  <rect x="805" y="475" width="350" height="170" rx="28" fill="#e4e0eb" stroke="#6a5b78" stroke-width="3"/><text x="980" y="530" fill="#574666" font-size="27" font-weight="700">CATTOLICI</text><text x="980" y="572" fill="#352f4a" font-size="18">non expedit · Opera dei congressi</text><text x="980" y="605" fill="#352f4a" font-size="19">associazioni e opere sociali</text></g>
</svg>
