<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Benefici e costi della tariffa doganale del 1887</title><desc id="d">Schema causale sui gruppi favoriti e danneggiati dal protezionismo.</desc>
  <rect width="1200" height="750" fill="#fffaf4"/><text x="70" y="82" fill="#352f4a" font-family="Georgia,serif" font-size="46">Protezionismo: una scelta, interessi diversi</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="390" y="145" width="420" height="115" rx="30" fill="#352f4a"/><text x="600" y="194" fill="#fff" font-size="28" font-weight="700">TARIFFA DOGANALE 1887</text><text x="600" y="230" fill="#eaddeb" font-size="21">dazi su prodotti industriali e cereali</text>
  <path d="M500 260 280 385M700 260 925 385" stroke="#a24f5f" stroke-width="7" fill="none"/><path d="m270 378 8 21 20-2m637-19-8 21-20-2" fill="none" stroke="#a24f5f" stroke-width="7"/>
  <rect x="70" y="390" width="430" height="235" rx="28" fill="#e1eadf" stroke="#64805e" stroke-width="3"/><text x="285" y="440" fill="#4e704c" font-size="27" font-weight="700">FAVORISCE</text><text x="285" y="490" fill="#352f4a" font-size="23">siderurgia e tessile</text><text x="285" y="530" fill="#352f4a" font-size="23">grandi produttori di grano</text><text x="285" y="570" fill="#352f4a" font-size="21">mercato interno più protetto</text>
  <rect x="700" y="390" width="430" height="235" rx="28" fill="#f0dfe1" stroke="#a24f5f" stroke-width="3"/><text x="915" y="440" fill="#a24f5f" font-size="27" font-weight="700">SCARICA COSTI SU</text><text x="915" y="490" fill="#352f4a" font-size="23">consumatori: pane più caro</text><text x="915" y="530" fill="#352f4a" font-size="23">colture meridionali d'esportazione</text><text x="915" y="570" fill="#352f4a" font-size="21">rapporti commerciali con la Francia</text></g>
  <text x="600" y="695" text-anchor="middle" fill="#6f6874" font-family="Arial,sans-serif" font-size="22">Non “l'economia italiana”, ma gruppi e territori con interessi concorrenti.</text>
</svg>
