<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">L'allargamento del suffragio nel 1882</title><desc id="d">Confronto fra elettori prima e dopo la riforma e gruppi ancora esclusi.</desc>
  <rect width="1200" height="750" fill="#fffaf4"/><text x="70" y="85" fill="#352f4a" font-family="Georgia,serif" font-size="48">Più elettori, non suffragio universale</text>
  <text x="70" y="130" fill="#6f6874" font-family="Arial,sans-serif" font-size="23">Quota approssimativa sulla popolazione complessiva</text>
  <g transform="translate(90 205)"><text y="45" fill="#352f4a" font-family="Arial,sans-serif" font-size="27">Prima del 1882</text><rect x="240" width="720" height="58" rx="29" fill="#e3dbe2"/><rect x="240" width="158" height="58" rx="29" fill="#a24f5f"/><text x="420" y="41" fill="#352f4a" font-family="Arial,sans-serif" font-size="29" font-weight="700">circa 2,2%</text>
  <text y="170" fill="#352f4a" font-family="Arial,sans-serif" font-size="27">Dopo la riforma</text><rect x="240" y="125" width="720" height="58" rx="29" fill="#e3dbe2"/><rect x="240" y="125" width="497" height="58" rx="29" fill="#c49a55"/><text x="760" y="166" fill="#352f4a" font-family="Arial,sans-serif" font-size="29" font-weight="700">circa 6,9%</text></g>
  <g transform="translate(80 475)"><rect width="1040" height="190" rx="24" fill="#eee6ef" stroke="#c8b7cc" stroke-width="2"/><text x="35" y="48" fill="#a24f5f" font-family="Arial,sans-serif" font-size="25" font-weight="700">RESTANO ESCLUSI</text><text x="35" y="94" fill="#352f4a" font-family="Arial,sans-serif" font-size="28">tutte le donne</text><text x="355" y="94" fill="#352f4a" font-family="Arial,sans-serif" font-size="28">gran parte degli uomini analfabeti</text><text x="35" y="145" fill="#352f4a" font-family="Arial,sans-serif" font-size="22">Il cambiamento è reale, ma il corpo politico resta una minoranza.</text></g>
</svg>
