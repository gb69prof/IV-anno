<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc"><title id="title">Pensatori e problemi</title><desc id="desc">Domande diverse producono risposte da non sovrapporre. Limitare il comando: Montesquieu: distinguere funzioni ed equilibrare il potere. Giustificare l’obbedienza: Locke: tutelare diritti. Rousseau: sovranità e volontà generale. Convivenza e giustizia: Voltaire: tolleranza. Beccaria: legalità e proporzionalità delle pene. Organizzare il sapere: Diderot e d’Alembert: connessioni tra scienze, arti e mestieri. Questione comune: Quali ragioni rendono legittimi potere, leggi e gerarchie?</desc><rect width="1120" height="980" fill="#fbf6e9"/><text x="56" y="68" fill="#183747" font-family="Georgia,serif" font-size="40">Pensatori e problemi</text><text x="56" y="112" font-family="Arial,sans-serif" font-size="24" fill="#435865">Domande diverse producono risposte da non sovrapporre.</text><path d="M72 165 V310" stroke="#986229" stroke-width="3"/><circle cx="72" cy="199" r="23" fill="#183747"/><text x="72" y="207" text-anchor="middle" font-family="Arial" fill="white" font-size="24">1</text><rect x="115" y="165" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="202" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Limitare il comando</text><text x="139" y="242" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Montesquieu: distinguere funzioni ed equilibrare il potere.</text><path d="M72 316 V461" stroke="#986229" stroke-width="3"/><circle cx="72" cy="350" r="23" fill="#183747"/><text x="72" y="358" text-anchor="middle" font-family="Arial" fill="white" font-size="24">2</text><rect x="115" y="316" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="353" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Giustificare l’obbedienza</text><text x="139" y="393" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Locke: tutelare diritti. Rousseau: sovranità e volontà generale.</text><path d="M72 467 V612" stroke="#986229" stroke-width="3"/><circle cx="72" cy="501" r="23" fill="#183747"/><text x="72" y="509" text-anchor="middle" font-family="Arial" fill="white" font-size="24">3</text><rect x="115" y="467" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="504" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Convivenza e giustizia</text><text x="139" y="544" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Voltaire: tolleranza. Beccaria: legalità e proporzionalità delle</text><text x="139" y="574" fill="#263c47" font-family="Arial,sans-serif" font-size="25">pene.</text><path d="M72 618 V763" stroke="#986229" stroke-width="3"/><circle cx="72" cy="652" r="23" fill="#183747"/><text x="72" y="660" text-anchor="middle" font-family="Arial" fill="white" font-size="24">4</text><rect x="115" y="618" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="655" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Organizzare il sapere</text><text x="139" y="695" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Diderot e d’Alembert: connessioni tra scienze, arti e mestieri.</text><path d="M72 769 V914" stroke="#986229" stroke-width="3"/><circle cx="72" cy="803" r="23" fill="#183747"/><text x="72" y="811" text-anchor="middle" font-family="Arial" fill="white" font-size="24">5</text><rect x="115" y="769" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="806" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Questione comune</text><text x="139" y="846" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Quali ragioni rendono legittimi potere, leggi e gerarchie?</text><text x="56" y="965" fill="#435865" font-family="Arial" font-size="20">gbprof · Relazioni da spiegare, non date da memorizzare</text></svg>