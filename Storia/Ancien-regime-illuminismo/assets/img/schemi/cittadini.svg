<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc"><title id="title">Dai sudditi ai cittadini</title><desc id="desc">Il nuovo criterio resta una tensione storica incompiuta. Ordine ereditato: Nascita, appartenenza e privilegio distribuiscono status. Critica dei Lumi: Ragione e diritti mettono alla prova quella giustificazione. Riforme dall’alto: Si modernizza lo Stato senza trasferire la sovranità al popolo. Esclusioni: Donne e schiavizzati rendono visibile il limite dell’universalismo. Rivoluzioni: Idee, guerre, crisi e scelte aprono esiti politici non inevitabili.</desc><rect width="1120" height="980" fill="#fbf6e9"/><text x="56" y="68" fill="#183747" font-family="Georgia,serif" font-size="40">Dai sudditi ai cittadini</text><text x="56" y="112" font-family="Arial,sans-serif" font-size="24" fill="#435865">Il nuovo criterio resta una tensione storica incompiuta.</text><path d="M72 165 V310" stroke="#986229" stroke-width="3"/><circle cx="72" cy="199" r="23" fill="#183747"/><text x="72" y="207" text-anchor="middle" font-family="Arial" fill="white" font-size="24">1</text><rect x="115" y="165" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="202" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Ordine ereditato</text><text x="139" y="242" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Nascita, appartenenza e privilegio distribuiscono status.</text><path d="M72 316 V461" stroke="#986229" stroke-width="3"/><circle cx="72" cy="350" r="23" fill="#183747"/><text x="72" y="358" text-anchor="middle" font-family="Arial" fill="white" font-size="24">2</text><rect x="115" y="316" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="353" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Critica dei Lumi</text><text x="139" y="393" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Ragione e diritti mettono alla prova quella giustificazione.</text><path d="M72 467 V612" stroke="#986229" stroke-width="3"/><circle cx="72" cy="501" r="23" fill="#183747"/><text x="72" y="509" text-anchor="middle" font-family="Arial" fill="white" font-size="24">3</text><rect x="115" y="467" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="504" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Riforme dall’alto</text><text x="139" y="544" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Si modernizza lo Stato senza trasferire la sovranità al popolo.</text><path d="M72 618 V763" stroke="#986229" stroke-width="3"/><circle cx="72" cy="652" r="23" fill="#183747"/><text x="72" y="660" text-anchor="middle" font-family="Arial" fill="white" font-size="24">4</text><rect x="115" y="618" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="655" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Esclusioni</text><text x="139" y="695" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Donne e schiavizzati rendono visibile il limite</text><text x="139" y="725" fill="#263c47" font-family="Arial,sans-serif" font-size="25">dell’universalismo.</text><path d="M72 769 V914" stroke="#986229" stroke-width="3"/><circle cx="72" cy="803" r="23" fill="#183747"/><text x="72" y="811" text-anchor="middle" font-family="Arial" fill="white" font-size="24">5</text><rect x="115" y="769" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="806" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Rivoluzioni</text><text x="139" y="846" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Idee, guerre, crisi e scelte aprono esiti politici non</text><text x="139" y="876" fill="#263c47" font-family="Arial,sans-serif" font-size="25">inevitabili.</text><text x="56" y="965" fill="#435865" font-family="Arial" font-size="20">gbprof · Relazioni da spiegare, non date da memorizzare</text></svg>