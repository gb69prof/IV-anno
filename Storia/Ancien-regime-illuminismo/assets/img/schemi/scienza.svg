<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc"><title id="title">Dalla scienza alla critica</title><desc id="desc">Un’ispirazione metodologica, non una causa unica. Osservazione: Strumenti ed esperienza mettono alla prova immagini del mondo. Galileo e Newton: Matematica e indagine spiegano fenomeni terrestri e celesti. Nuovo criterio: Un’autorità non basta: le affermazioni richiedono ragioni e prove. Estensione delle domande: Anche istituzioni e costumi possono essere valutati criticamente. Distinzione: La legge fisica descrive; la norma giuridica prescrive ed è modificabile.</desc><rect width="1120" height="980" fill="#fbf6e9"/><text x="56" y="68" fill="#183747" font-family="Georgia,serif" font-size="40">Dalla scienza alla critica</text><text x="56" y="112" font-family="Arial,sans-serif" font-size="24" fill="#435865">Un’ispirazione metodologica, non una causa unica.</text><path d="M72 165 V310" stroke="#986229" stroke-width="3"/><circle cx="72" cy="199" r="23" fill="#183747"/><text x="72" y="207" text-anchor="middle" font-family="Arial" fill="white" font-size="24">1</text><rect x="115" y="165" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="202" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Osservazione</text><text x="139" y="242" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Strumenti ed esperienza mettono alla prova immagini del mondo.</text><path d="M72 316 V461" stroke="#986229" stroke-width="3"/><circle cx="72" cy="350" r="23" fill="#183747"/><text x="72" y="358" text-anchor="middle" font-family="Arial" fill="white" font-size="24">2</text><rect x="115" y="316" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="353" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Galileo e Newton</text><text x="139" y="393" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Matematica e indagine spiegano fenomeni terrestri e celesti.</text><path d="M72 467 V612" stroke="#986229" stroke-width="3"/><circle cx="72" cy="501" r="23" fill="#183747"/><text x="72" y="509" text-anchor="middle" font-family="Arial" fill="white" font-size="24">3</text><rect x="115" y="467" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="504" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Nuovo criterio</text><text x="139" y="544" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Un’autorità non basta: le affermazioni richiedono ragioni e</text><text x="139" y="574" fill="#263c47" font-family="Arial,sans-serif" font-size="25">prove.</text><path d="M72 618 V763" stroke="#986229" stroke-width="3"/><circle cx="72" cy="652" r="23" fill="#183747"/><text x="72" y="660" text-anchor="middle" font-family="Arial" fill="white" font-size="24">4</text><rect x="115" y="618" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="655" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Estensione delle domande</text><text x="139" y="695" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Anche istituzioni e costumi possono essere valutati criticamente.</text><path d="M72 769 V914" stroke="#986229" stroke-width="3"/><circle cx="72" cy="803" r="23" fill="#183747"/><text x="72" y="811" text-anchor="middle" font-family="Arial" fill="white" font-size="24">5</text><rect x="115" y="769" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="806" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Distinzione</text><text x="139" y="846" fill="#263c47" font-family="Arial,sans-serif" font-size="25">La legge fisica descrive; la norma giuridica prescrive ed è</text><text x="139" y="876" fill="#263c47" font-family="Arial,sans-serif" font-size="25">modificabile.</text><text x="56" y="965" fill="#435865" font-family="Arial" font-size="20">gbprof · Relazioni da spiegare, non date da memorizzare</text></svg>