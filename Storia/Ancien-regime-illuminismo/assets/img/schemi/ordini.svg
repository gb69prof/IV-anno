<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc"><title id="title">Società per ordini</title><desc id="desc">Nascita e appartenenza distribuiscono condizioni giuridiche. Nascita e appartenenza: Collocano la persona in una condizione sociale riconosciuta. Clero e nobiltà: Possiedono prerogative, ma comprendono situazioni economiche diverse. Terzo Stato: Comprende tutti gli altri: ricchi mercanti, artigiani, contadini e poveri. Privilegi e obblighi: Diritti particolari, prelievi e oneri variano secondo gruppi e territori. Tensione: La ricchezza può crescere senza attribuire il rango e le prerogative nobiliari.</desc><rect width="1120" height="980" fill="#fbf6e9"/><text x="56" y="68" fill="#183747" font-family="Georgia,serif" font-size="40">Società per ordini</text><text x="56" y="112" font-family="Arial,sans-serif" font-size="24" fill="#435865">Nascita e appartenenza distribuiscono condizioni giuridiche.</text><path d="M72 165 V310" stroke="#986229" stroke-width="3"/><circle cx="72" cy="199" r="23" fill="#183747"/><text x="72" y="207" text-anchor="middle" font-family="Arial" fill="white" font-size="24">1</text><rect x="115" y="165" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="202" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Nascita e appartenenza</text><text x="139" y="242" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Collocano la persona in una condizione sociale riconosciuta.</text><path d="M72 316 V461" stroke="#986229" stroke-width="3"/><circle cx="72" cy="350" r="23" fill="#183747"/><text x="72" y="358" text-anchor="middle" font-family="Arial" fill="white" font-size="24">2</text><rect x="115" y="316" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="353" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Clero e nobiltà</text><text x="139" y="393" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Possiedono prerogative, ma comprendono situazioni economiche</text><text x="139" y="423" fill="#263c47" font-family="Arial,sans-serif" font-size="25">diverse.</text><path d="M72 467 V612" stroke="#986229" stroke-width="3"/><circle cx="72" cy="501" r="23" fill="#183747"/><text x="72" y="509" text-anchor="middle" font-family="Arial" fill="white" font-size="24">3</text><rect x="115" y="467" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="504" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Terzo Stato</text><text x="139" y="544" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Comprende tutti gli altri: ricchi mercanti, artigiani, contadini</text><text x="139" y="574" fill="#263c47" font-family="Arial,sans-serif" font-size="25">e poveri.</text><path d="M72 618 V763" stroke="#986229" stroke-width="3"/><circle cx="72" cy="652" r="23" fill="#183747"/><text x="72" y="660" text-anchor="middle" font-family="Arial" fill="white" font-size="24">4</text><rect x="115" y="618" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="655" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Privilegi e obblighi</text><text x="139" y="695" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Diritti particolari, prelievi e oneri variano secondo gruppi e</text><text x="139" y="725" fill="#263c47" font-family="Arial,sans-serif" font-size="25">territori.</text><path d="M72 769 V914" stroke="#986229" stroke-width="3"/><circle cx="72" cy="803" r="23" fill="#183747"/><text x="72" y="811" text-anchor="middle" font-family="Arial" fill="white" font-size="24">5</text><rect x="115" y="769" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="806" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Tensione</text><text x="139" y="846" fill="#263c47" font-family="Arial,sans-serif" font-size="25">La ricchezza può crescere senza attribuire il rango e le</text><text x="139" y="876" fill="#263c47" font-family="Arial,sans-serif" font-size="25">prerogative nobiliari.</text><text x="56" y="965" fill="#435865" font-family="Arial" font-size="20">gbprof · Relazioni da spiegare, non date da memorizzare</text></svg>