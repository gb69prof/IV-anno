<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc"><title id="title">Monarchia assoluta</title><desc id="desc">Supremazia rivendicata, strumenti di governo e limiti reali. Diritto divino: Offre una giustificazione sacra dell’autorità del sovrano. Governo: Uffici, esercito, fiscalità e diplomazia rendono possibile il comando. Versailles: Accessi, rituali e moda rappresentano e distribuiscono distinzione. Vincoli: Consuetudini, autonomie, corpi intermedi e risorse limitano l’azione. Tensione: Assoluto non significa materialmente onnipotente.</desc><rect width="1120" height="980" fill="#fbf6e9"/><text x="56" y="68" fill="#183747" font-family="Georgia,serif" font-size="40">Monarchia assoluta</text><text x="56" y="112" font-family="Arial,sans-serif" font-size="24" fill="#435865">Supremazia rivendicata, strumenti di governo e limiti reali.</text><path d="M72 165 V310" stroke="#986229" stroke-width="3"/><circle cx="72" cy="199" r="23" fill="#183747"/><text x="72" y="207" text-anchor="middle" font-family="Arial" fill="white" font-size="24">1</text><rect x="115" y="165" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="202" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Diritto divino</text><text x="139" y="242" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Offre una giustificazione sacra dell’autorità del sovrano.</text><path d="M72 316 V461" stroke="#986229" stroke-width="3"/><circle cx="72" cy="350" r="23" fill="#183747"/><text x="72" y="358" text-anchor="middle" font-family="Arial" fill="white" font-size="24">2</text><rect x="115" y="316" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="353" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Governo</text><text x="139" y="393" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Uffici, esercito, fiscalità e diplomazia rendono possibile il</text><text x="139" y="423" fill="#263c47" font-family="Arial,sans-serif" font-size="25">comando.</text><path d="M72 467 V612" stroke="#986229" stroke-width="3"/><circle cx="72" cy="501" r="23" fill="#183747"/><text x="72" y="509" text-anchor="middle" font-family="Arial" fill="white" font-size="24">3</text><rect x="115" y="467" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="504" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Versailles</text><text x="139" y="544" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Accessi, rituali e moda rappresentano e distribuiscono</text><text x="139" y="574" fill="#263c47" font-family="Arial,sans-serif" font-size="25">distinzione.</text><path d="M72 618 V763" stroke="#986229" stroke-width="3"/><circle cx="72" cy="652" r="23" fill="#183747"/><text x="72" y="660" text-anchor="middle" font-family="Arial" fill="white" font-size="24">4</text><rect x="115" y="618" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="655" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Vincoli</text><text x="139" y="695" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Consuetudini, autonomie, corpi intermedi e risorse limitano</text><text x="139" y="725" fill="#263c47" font-family="Arial,sans-serif" font-size="25">l’azione.</text><path d="M72 769 V914" stroke="#986229" stroke-width="3"/><circle cx="72" cy="803" r="23" fill="#183747"/><text x="72" y="811" text-anchor="middle" font-family="Arial" fill="white" font-size="24">5</text><rect x="115" y="769" width="950" height="130" rx="8" fill="white" stroke="#b9a989"/><text x="139" y="806" fill="#183747" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Tensione</text><text x="139" y="846" fill="#263c47" font-family="Arial,sans-serif" font-size="25">Assoluto non significa materialmente onnipotente.</text><text x="56" y="965" fill="#435865" font-family="Arial" font-size="20">gbprof · Relazioni da spiegare, non date da memorizzare</text></svg>