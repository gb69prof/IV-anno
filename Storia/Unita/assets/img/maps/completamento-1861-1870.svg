<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d"><title id="t">Completamento territoriale del Regno</title><desc id="d">Carta schematica di Regno d'Italia, Veneto e Roma tra 1861 e 1870</desc><rect width="1000" height="760" fill="#f2ede3"/><text x="40" y="54" font-family="Georgia,serif" font-size="34" fill="#233746">1861-1870: uno Stato ancora incompleto</text><g transform="translate(170 90) scale(.78)"><path d="M170 0l104 28 48 116-18 74-30 79 48 78 54 86-91 64 62 99-69 82-119-139-89-110-59-139 45-95-47-91z" fill="#8ca2ae" stroke="#233746" stroke-width="7"/><path d="M111 720l143-35 152 49-62 76-195 9z" fill="#8ca2ae" stroke="#233746" stroke-width="7"/><path d="M252 80l70 64-18 74-30 79-54-25z" fill="#c38a49" stroke="#233746" stroke-width="6"/><path d="M270 360l52 15 54 86-91 64-30-53z" fill="#a65044" stroke="#233746" stroke-width="6"/><text x="333" y="176" font-family="system-ui" font-size="26" font-weight="800" fill="#233746">VENETO 1866</text><text x="385" y="435" font-family="system-ui" font-size="26" font-weight="800" fill="#233746">ROMA 1870</text><path d="M430 160H335M450 420H350" stroke="#233746" stroke-width="4"/></g><g transform="translate(635 150)" font-family="system-ui" fill="#233746"><text y="0" font-family="Georgia,serif" font-size="30">Tre passaggi diversi</text><circle cy="70" r="13" fill="#8ca2ae"/><text x="30" y="78" font-size="20"><tspan font-weight="800">1861</tspan> - Regno proclamato</text><circle cy="140" r="13" fill="#c38a49"/><text x="30" y="148" font-size="20"><tspan font-weight="800">1866</tspan> - guerra e trattato</text><circle cy="210" r="13" fill="#a65044"/><text x="30" y="218" font-size="20"><tspan font-weight="800">1870</tspan> - occupazione e plebiscito</text><path d="M0 285h285" stroke="#c7b89f" stroke-width="2"/><text y="330" font-size="18">Non è una linea inevitabile:</text><text y="360" font-size="18">dipende dalle guerre europee</text><text y="390" font-size="18">e dal ritiro della protezione francese.</text></g><text x="40" y="720" font-family="system-ui" font-size="17" fill="#61707a">Ricostruzione didattica; il Trentino e Trieste restano fuori dal Regno.</text></svg>
