<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100"><rect width="900" height="1100" fill="#e2d4b7"/><rect x="70" y="55" width="760" height="990" rx="8" fill="#fffaf0" stroke="#917b58" stroke-width="4"/><text x="450" y="145" text-anchor="middle" font-family="Georgia" font-size="35" fill="#251f18">CONSTITUCIÓN POLÍTICA</text><text x="450" y="190" text-anchor="middle" font-family="Georgia" font-size="24" fill="#514532">DE LA MONARQUÍA ESPAÑOLA · 1812</text><path d="M180 230h540" stroke="#9c4d3f" stroke-width="3"/><g font-family="Georgia" fill="#332c22"><text x="130" y="300" font-size="24">Art. 1. La Nación española es la reunión</text><text x="130" y="340" font-size="24">de todos los españoles de ambos hemisferios.</text><text x="130" y="430" font-size="24">Art. 3. La soberanía reside esencialmente</text><text x="130" y="470" font-size="24">en la Nación.</text></g><rect x="115" y="550" width="670" height="250" rx="18" fill="#edf0ea"/><text x="450" y="620" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#172c33">FACSIMILE DIDATTICO</text><text x="450" y="670" text-anchor="middle" font-family="system-ui" font-size="20" fill="#384b4e">Non riproduce l'impaginazione originale.</text><text x="450" y="715" text-anchor="middle" font-family="system-ui" font-size="20" fill="#384b4e">Serve a isolare due articoli da interrogare.</text><text x="450" y="930" text-anchor="middle" font-family="Georgia" font-size="25" fill="#9c4d3f">Chi è la nazione? Dove risiede la sovranità?</text></svg>
