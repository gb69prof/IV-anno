<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Quattro sistemi politici</title><desc id="d">Confronto schematico di Francia, Gran Bretagna, Russia e Austria-Ungheria</desc><rect width="1000" height="650" fill="#f7f1e7"/><text x="55" y="70" font-family="Georgia,serif" font-size="42" fill="#243b4a">Quattro modernità politiche</text><g font-family="system-ui,sans-serif"><g transform="translate(55 120)"><rect width="430" height="205" rx="24" fill="#fffaf1" stroke="#c69b4b" stroke-width="3"/><text x="28" y="46" font-size="27" font-weight="700" fill="#973f45">FRANCIA</text><text x="28" y="83" font-size="20" fill="#243b4a">Repubblica parlamentare</text><text x="28" y="124" font-size="18">+ suffragio maschile · scuola laica</text><text x="28" y="157" font-size="18">− Comune · nazionalismo · Dreyfus</text></g><g transform="translate(515 120)"><rect width="430" height="205" rx="24" fill="#fffaf1" stroke="#c69b4b" stroke-width="3"/><text x="28" y="46" font-size="27" font-weight="700" fill="#973f45">GRAN BRETAGNA</text><text x="28" y="83" font-size="20" fill="#243b4a">Monarchia parlamentare</text><text x="28" y="124" font-size="18">+ riforme elettorali · partiti</text><text x="28" y="157" font-size="18">− Irlanda · Lord · esclusioni</text></g><g transform="translate(55 355)"><rect width="430" height="205" rx="24" fill="#fffaf1" stroke="#536f7e" stroke-width="3"/><text x="28" y="46" font-size="27" font-weight="700" fill="#973f45">RUSSIA</text><text x="28" y="83" font-size="20" fill="#243b4a">Autocrazia zarista</text><text x="28" y="124" font-size="18">+ industria · ferrovie · Stato</text><text x="28" y="157" font-size="18">− rappresentanza · minoranze</text></g><g transform="translate(515 355)"><rect width="430" height="205" rx="24" fill="#fffaf1" stroke="#536f7e" stroke-width="3"/><text x="28" y="46" font-size="27" font-weight="700" fill="#973f45">AUSTRIA-UNGHERIA</text><text x="28" y="83" font-size="20" fill="#243b4a">Dualismo costituzionale</text><text x="28" y="124" font-size="18">+ parlamenti · pluralità culturale</text><text x="28" y="157" font-size="18">− gerarchie nazionali · Balcani</text></g></g></svg>
