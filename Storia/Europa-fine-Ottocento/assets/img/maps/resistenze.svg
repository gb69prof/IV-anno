<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t"><title id="t">Dal dominio alle resistenze</title><rect width="1000" height="650" fill="#f7f1e7"/><text x="55" y="70" font-family="Georgia,serif" font-size="42" fill="#243b4a">Conquista e risposta storica</text><g font-family="system-ui,sans-serif"><g transform="translate(60 120)"><rect width="350" height="430" rx="28" fill="#243b4a"/><text x="32" y="55" font-size="27" fill="#d5b264" font-weight="700">STRUMENTI DEL DOMINIO</text><g fill="#fff" font-size="21"><text x="38" y="120">• trattati diseguali</text><text x="38" y="172">• eserciti e truppe coloniali</text><text x="38" y="224">• tassazione e lavoro forzato</text><text x="38" y="276">• ferrovie e telegrafo</text><text x="38" y="328">• scuola e missioni</text><text x="38" y="380">• gerarchie razziali</text></g></g><g transform="translate(590 120)"><rect width="350" height="430" rx="28" fill="#fffaf1" stroke="#973f45" stroke-width="4"/><text x="32" y="55" font-size="27" fill="#973f45" font-weight="700">FORME DI RESISTENZA</text><g fill="#243b4a" font-size="21"><text x="38" y="120">• guerra e guerriglia</text><text x="38" y="172">• diplomazia e alleanze</text><text x="38" y="224">• migrazione e diserzione</text><text x="38" y="276">• adattamento selettivo</text><text x="38" y="328">• religione e cultura</text><text x="38" y="380">• nazionalismo politico</text></g></g><g stroke="#c69b4b" stroke-width="8" fill="none"><path d="M420 250C500 180 505 180 580 250"/><path d="M580 420C500 490 495 490 420 420"/></g><text x="500" y="323" text-anchor="middle" fill="#243b4a" font-weight="700" font-size="20">conflitto</text><text x="500" y="350" text-anchor="middle" fill="#687075" font-size="18">negoziato</text></g></svg>
