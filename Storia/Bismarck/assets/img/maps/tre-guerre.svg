<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#f4efe5"/><text x="60" y="75" font-family="Georgia" font-size="38" fill="#173747">Tre guerre, tre trasformazioni</text><g font-family="system-ui"><g transform="translate(70 155)"><circle cx="150" cy="150" r="125" fill="#315c6b"/><text x="150" y="125" text-anchor="middle" font-size="46" fill="#fff" font-weight="800">1864</text><text x="150" y="170" text-anchor="middle" font-size="23" fill="#fff">Danimarca</text><text x="150" y="215" text-anchor="middle" font-size="18" fill="#e9d6a3">I ducati</text><rect y="320" width="300" height="120" rx="18" fill="#fff" stroke="#c9bda8"/><text x="150" y="370" text-anchor="middle" font-size="22" font-weight="700">Prussia + Austria</text><text x="150" y="404" text-anchor="middle" font-size="17">alleate e poi rivali</text></g><path d="M390 305h90" stroke="#9d4938" stroke-width="10"/><g transform="translate(450 155)"><circle cx="150" cy="150" r="125" fill="#9d4938"/><text x="150" y="125" text-anchor="middle" font-size="46" fill="#fff" font-weight="800">1866</text><text x="150" y="170" text-anchor="middle" font-size="23" fill="#fff">Austria</text><text x="150" y="215" text-anchor="middle" font-size="18" fill="#f3d9d0">L'egemonia</text><rect y="320" width="300" height="120" rx="18" fill="#fff" stroke="#c9bda8"/><text x="150" y="370" text-anchor="middle" font-size="22" font-weight="700">Austria esclusa</text><text x="150" y="404" text-anchor="middle" font-size="17">Nord federale</text></g><path d="M770 305h90" stroke="#9d4938" stroke-width="10"/><g transform="translate(830 155)"><circle cx="150" cy="150" r="125" fill="#173747"/><text x="150" y="125" text-anchor="middle" font-size="46" fill="#fff" font-weight="800">1870</text><text x="150" y="170" text-anchor="middle" font-size="23" fill="#fff">Francia</text><text x="150" y="215" text-anchor="middle" font-size="18" fill="#e9d6a3">Il Sud aderisce</text><rect y="320" width="300" height="120" rx="18" fill="#fff" stroke="#c9bda8"/><text x="150" y="370" text-anchor="middle" font-size="22" font-weight="700">Reich nel 1871</text><text x="150" y="404" text-anchor="middle" font-size="17">Alsazia-Lorena</text></g></g><text x="60" y="690" font-family="system-ui" font-size="18" fill="#687075">La sequenza non era già scritta nel 1862: ogni guerra dipese da decisioni e circostanze.</text></svg>
