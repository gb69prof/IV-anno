<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#f4efe5"/><text x="60" y="70" font-family="Georgia" font-size="38" fill="#173747">La costituzione a due legittimità</text><g font-family="system-ui" text-anchor="middle"><rect x="430" y="105" width="340" height="105" rx="22" fill="#173747"/><text x="600" y="150" fill="#fff" font-size="28" font-weight="800">Imperatore</text><text x="600" y="182" fill="#dbe7e8" font-size="17">nomina il cancelliere</text><rect x="430" y="275" width="340" height="105" rx="22" fill="#315c6b"/><text x="600" y="320" fill="#fff" font-size="28" font-weight="800">Cancelliere</text><text x="600" y="352" fill="#dbe7e8" font-size="17">responsabile verso l'imperatore</text><rect x="70" y="480" width="410" height="120" rx="22" fill="#c69b4b"/><text x="275" y="525" font-size="28" font-weight="800">Bundesrat</text><text x="275" y="560" font-size="17">governi degli Stati</text><rect x="720" y="480" width="410" height="120" rx="22" fill="#9d4938"/><text x="925" y="525" fill="#fff" font-size="28" font-weight="800">Reichstag</text><text x="925" y="560" fill="#f4ddd7" font-size="17">eletto dai maschi adulti</text><path d="M600 210v65M520 380L320 480M680 380l200 100" stroke="#173747" stroke-width="7"/><path d="M480 540h240" stroke="#687075" stroke-width="7" stroke-dasharray="16 12"/><text x="600" y="520" font-size="16" fill="#687075">leggi e bilancio</text><text x="275" y="650" font-size="17" fill="#687075">legittimità federale</text><text x="925" y="650" font-size="17" fill="#687075">legittimità elettorale</text></g></svg>
