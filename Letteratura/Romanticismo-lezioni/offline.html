<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061d2f">
  <title>Romanticismo — Offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; background: #041725; color: #fff5df; }
    main { width: min(42rem, 100%); padding: 2rem; border: 1px solid #c88d35; border-radius: 22px; background: #08283c; }
    h1 { margin-top: 0; color: #f1cf88; font-family: Georgia, serif; font-size: clamp(2rem, 8vw, 4rem); }
    p { line-height: 1.65; }
    a { display: inline-block; min-height: 2.8rem; padding: .65rem 1rem; border: 1px solid #c88d35; border-radius: 999px; color: #f1cf88; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>La strada è momentaneamente interrotta</h1>
    <p>Questa pagina non è ancora disponibile nella cache. Torna alla copertina: dopo una prima visita online, il percorso principale resta consultabile anche senza connessione.</p>
    <a href="./">Torna al libro</a>
  </main>
</body>
</html>
