<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Mappa finale del percorso sul Romanticismo</title>
  <desc id="desc">Il mondo ordinato entra in crisi attraverso quattro fratture, che producono una nuova immagine del mondo e nuove forme letterarie. Le vie europee e quella italiana confluiscono in un'eredità moderna insieme liberatrice e ambivalente.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071e30"/><stop offset="1" stop-color="#020c14"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f1cf88"/></marker></defs>
  <rect width="1200" height="900" rx="36" fill="url(#bg)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="600" y="55" font-family="Georgia,serif" font-size="36" font-weight="700" fill="#f1cf88">Mappa finale del percorso</text>
    <rect x="350" y="85" width="500" height="90" rx="22" fill="#f7e9c8"/><text x="600" y="122" font-size="23" font-weight="700" fill="#041725">1 · MONDO ORDINATO</text><text x="600" y="151" font-size="17" fill="#1f1a14">ragione · progresso · misura</text>
    <path d="M600 175V220" stroke="#f1cf88" stroke-width="4" marker-end="url(#a)"/><text x="620" y="207" text-anchor="start" font-size="16" fill="#f1cf88">entra in crisi</text>
    <rect x="350" y="225" width="500" height="90" rx="22" fill="#421b1c" stroke="#c88d35" stroke-width="3"/><text x="600" y="262" font-size="23" font-weight="700" fill="#f1cf88">2 · FRATTURE</text><text x="600" y="291" font-size="17" fill="#fff5df">storia · ragione · io · tradizione</text>
    <path d="M600 315V360" stroke="#f1cf88" stroke-width="4" marker-end="url(#a)"/><text x="620" y="347" text-anchor="start" font-size="16" fill="#f1cf88">producono</text>
    <rect x="300" y="365" width="600" height="90" rx="22" fill="#f7e9c8"/><text x="600" y="402" font-size="23" font-weight="700" fill="#041725">3 · NUOVA IMMAGINE DEL MONDO</text><text x="600" y="431" font-size="17" fill="#1f1a14">uomo · natura · storia · popolo · nazione · arte</text>
    <path d="M600 455V500" stroke="#f1cf88" stroke-width="4" marker-end="url(#a)"/><text x="620" y="487" text-anchor="start" font-size="16" fill="#f1cf88">si traduce in</text>
    <rect x="300" y="505" width="600" height="90" rx="22" fill="#421b1c" stroke="#c88d35" stroke-width="3"/><text x="600" y="542" font-size="23" font-weight="700" fill="#f1cf88">4 · NUOVA LETTERATURA</text><text x="600" y="571" font-size="17" fill="#fff5df">forme · generi · linguaggio · autore · pubblico</text>
    <path d="M600 595V630M600 630L355 690M600 630L845 690" stroke="#f1cf88" stroke-width="4" marker-end="url(#a)"/><text x="620" y="624" text-anchor="start" font-size="16" fill="#f1cf88">si differenzia in</text>
    <rect x="135" y="695" width="440" height="95" rx="22" fill="#254b3d" stroke="#f1cf88" stroke-width="3"/><text x="355" y="734" font-size="23" font-weight="700" fill="#fff5df">VIE EUROPEE</text><text x="355" y="764" font-size="17" fill="#fff5df">risposte nazionali plurali</text>
    <rect x="625" y="695" width="440" height="95" rx="22" fill="#254b3d" stroke="#f1cf88" stroke-width="3"/><text x="845" y="734" font-size="23" font-weight="700" fill="#fff5df">VIA ITALIANA</text><text x="845" y="764" font-size="17" fill="#fff5df">pubblico · nazione · funzione civile</text>
    <path d="M355 790L520 835M845 790L680 835" stroke="#f1cf88" stroke-width="4" marker-end="url(#a)"/>
    <rect x="330" y="815" width="540" height="75" rx="22" fill="#c88d35"/><text x="600" y="847" font-size="21" font-weight="700" fill="#041725">EREDITÀ MODERNA</text><text x="600" y="875" font-size="17" font-weight="700" fill="#041725">libertà e ambivalenza</text>
  </g>
</svg>
