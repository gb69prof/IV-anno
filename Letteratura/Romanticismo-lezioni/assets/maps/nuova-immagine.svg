<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">La nuova immagine romantica del mondo</title>
  <desc id="desc">Uomo, natura e storia confluiscono in una rete di relazioni; da essa emergono popolo, nazione e arte come modi di collegare memoria, appartenenza, visibile e invisibile.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7e9c8"/><stop offset="1" stop-color="#e4c997"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a5522"/></marker></defs>
  <rect width="1200" height="820" rx="36" fill="url(#bg)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="600" y="62" font-family="Georgia,serif" font-size="36" font-weight="700" fill="#041725">La nuova immagine del mondo</text>
    <rect x="70" y="115" width="300" height="120" rx="22" fill="#fff8e7" stroke="#8a5522" stroke-width="3"/><text x="220" y="158" font-size="24" font-weight="700" fill="#041725">UOMO</text><text x="220" y="192" font-size="18" fill="#1f1a14">finito → desidera l’infinito</text>
    <rect x="450" y="115" width="300" height="120" rx="22" fill="#fff8e7" stroke="#8a5522" stroke-width="3"/><text x="600" y="158" font-size="24" font-weight="700" fill="#041725">NATURA</text><text x="600" y="192" font-size="18" fill="#1f1a14">organismo · simbolo · sublime</text>
    <rect x="830" y="115" width="300" height="120" rx="22" fill="#fff8e7" stroke="#8a5522" stroke-width="3"/><text x="980" y="158" font-size="24" font-weight="700" fill="#041725">STORIA</text><text x="980" y="192" font-size="18" fill="#1f1a14">ogni epoca ha una fisionomia</text>
    <path d="M220 235L500 350M600 235V340M980 235L700 350" stroke="#8a5522" stroke-width="4" marker-end="url(#a)"/>
    <text x="600" y="310" font-size="17" fill="#6d3d16">si comprendono attraverso</text>
    <rect x="390" y="350" width="420" height="115" rx="24" fill="#041725" stroke="#c88d35" stroke-width="4"/><text x="600" y="395" font-size="25" font-weight="700" fill="#f1cf88">RELAZIONE</text><text x="600" y="430" font-size="18" fill="#fff5df">nessun elemento si comprende da solo</text>
    <path d="M600 465V520M600 520L220 610M600 520V600M600 520L980 610" stroke="#8a5522" stroke-width="4" marker-end="url(#a)"/>
    <text x="620" y="505" text-anchor="start" font-size="17" fill="#6d3d16">genera</text>
    <rect x="70" y="615" width="300" height="120" rx="22" fill="#421b1c"/><text x="220" y="657" font-size="24" font-weight="700" fill="#f1cf88">POPOLO</text><text x="220" y="691" font-size="18" fill="#fff5df">memoria · lingua · pubblico</text>
    <rect x="450" y="615" width="300" height="120" rx="22" fill="#421b1c"/><text x="600" y="657" font-size="24" font-weight="700" fill="#f1cf88">NAZIONE</text><text x="600" y="691" font-size="18" fill="#fff5df">comunità culturale → politica</text>
    <rect x="830" y="615" width="300" height="120" rx="22" fill="#421b1c"/><text x="980" y="657" font-size="24" font-weight="700" fill="#f1cf88">ARTE</text><text x="980" y="691" font-size="18" fill="#fff5df">visibile ↔ invisibile</text>
  </g>
</svg>
