<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061d2f"><meta name="description" content="Vittorio Alfieri: tragedia e libertà. Lezioni, mappe, appunti e verifiche con recupero."><meta name="apple-mobile-web-app-capable" content="yes"><title>Mappe concettuali | Vittorio Alfieri</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/icons/icon-180.png"><link rel="stylesheet" href="./assets/css/style.css"><link rel="stylesheet" href="./assets/css/alfieri.css"></head><body data-root="./"><main class="alfieri-home"><nav class="home-nav" aria-label="Navigazione principale"><a class="small-brand" href="./index.html">VA · VITTORIO ALFIERI</a><div class="links"><a href="./lezioni/introduzione.html">Lezioni</a><a href="./mappe.html">Mappe</a><a href="./fonti.html">Fonti</a><a href="./../">IV anno</a></div></nav><div class="home-section-title"><h1>Mappe concettuali</h1></div><p>Apri una mappa per ingrandirla. Segui le frecce e spiega a voce il rapporto fra i concetti.</p><div class="gallery-grid"><figure class="lesson-map-card"><button class="map-button" type="button" data-open-map data-map-src="./assets/mappe/introduzione.svg" data-map-title="Il mondo ereditato" aria-label="Ingrandisci la mappa: Il mondo ereditato"><img src="./assets/mappe/introduzione.svg" alt="Corte e privilegio legano alla Dipendenza dal sovrano. Dipendenza dal sovrano viene interrogata dalla Critica dei Lumi. Critica dei Lumi può affidarsi a Riforme dall’alto. Riforme dall’alto lasciano aperto il Problema dell’arbitrio. Problema dell’arbitrio richiede uno Scrittore indipendente."></button><figcaption>Il mondo ereditato</figcaption></figure><figure class="lesson-map-card"><button class="map-button" type="button" data-open-map data-map-src="./assets/mappe/fratture.svg" data-map-title="Le fratture e la scelta" aria-label="Ingrandisci la mappa: Le fratture e la scelta"><img src="./assets/mappe/fratture.svg" alt="Educazione ricevuta viene messa in crisi da Inquietudine e viaggi. Inquietudine e viaggi sfociano nella Scelta della tragedia. Scelta della tragedia richiede Disciplina della lingua. Disciplina della lingua si accompagna a Autonomia materiale. Autonomia materiale rende possibile la Vocazione come conquista."></button><figcaption>Le fratture e la scelta</figcaption></figure><figure class="lesson-map-card"><button class="map-button" type="button" data-open-map data-map-src="./assets/mappe/immagine-del-mondo.svg" data-map-title="La nuova immagine del mondo" aria-label="Ingrandisci la mappa: La nuova immagine del mondo"><img src="./assets/mappe/immagine-del-mondo.svg" alt="Potere sopra la legge produce Servitù e paura. Servitù e paura suscitano Rifiuto dell’arbitrio. Rifiuto dell’arbitrio si affida alla Volontà individuale. Volontà individuale incontra il limite delle Passioni incontrollate. Passioni incontrollate aprono la Tragedia interiore."></button><figcaption>La nuova immagine del mondo</figcaption></figure><figure class="lesson-map-card"><button class="map-button" type="button" data-open-map data-map-src="./assets/mappe/poetica.svg" data-map-title="La poetica della concentrazione" aria-label="Ingrandisci la mappa: La poetica della concentrazione"><img src="./assets/mappe/poetica.svg" alt="Conflitto assoluto richiede una Azione concentrata. Azione concentrata mette a confronto Pochi personaggi. Pochi personaggi si affrontano nel Dialogo sotto pressione. Dialogo sotto pressione si esprime in Verso e reticenza. Verso e reticenza chiamano in causa lo Spettatore coinvolto."></button><figcaption>La poetica della concentrazione</figcaption></figure><figure class="lesson-map-card"><button class="map-button" type="button" data-open-map data-map-src="./assets/mappe/opere.svg" data-map-title="Le opere: libertà alla prova" aria-label="Ingrandisci la mappa: Le opere: libertà alla prova"><img src="./assets/mappe/opere.svg" alt="Della tirannide dialoga con Del principe e delle lettere. Del principe e delle lettere si confronta con Filippo e tragedie politiche. Filippo e tragedie politiche anticipano il conflitto di Saul: il re diviso. Saul: il re diviso si confronta con Mirra: il desiderio taciuto. Mirra: il desiderio taciuto dialoga con Vita e Rime: costruire l’io."></button><figcaption>Le opere: libertà alla prova</figcaption></figure><figure class="lesson-map-card"><button class="map-button" type="button" data-open-map data-map-src="./assets/mappe/conclusione.svg" data-map-title="La libertà solitaria e il lascito" aria-label="Ingrandisci la mappa: La libertà solitaria e il lascito"><img src="./assets/mappe/conclusione.svg" alt="Mondo della corte viene spezzato da Fratture e autonomia. Fratture e autonomia alimentano il Rifiuto del dominio. Rifiuto del dominio si traduce nella Poetica della concentrazione. Poetica della concentrazione prende forma nelle Opere: volontà e limite. Opere: volontà e limite consegnano una Eredità e domanda aperta."></button><figcaption>La libertà solitaria e il lascito</figcaption></figure><figure class="lesson-map-card"><button class="map-button" type="button" data-open-map data-map-src="./assets/mappe/saul.svg" data-map-title="Saul: il re che non governa se stesso" aria-label="Ingrandisci la mappa: Saul: il re che non governa se stesso"><img src="./assets/mappe/saul.svg" alt="Grandezza ricordata si scontra con Vecchiaia e insicurezza. Vecchiaia e insicurezza si concentrano su Davide: affetto e minaccia. Davide: affetto e minaccia suscita Sospetto e ordini violenti. Sospetto e ordini violenti precedono la Sconfitta reale. Sconfitta reale precipita nella Catastrofe del re e del padre."></button><figcaption>Saul: il re che non governa se stesso</figcaption></figure><figure class="lesson-map-card"><button class="map-button" type="button" data-open-map data-map-src="./assets/mappe/mirra.svg" data-map-title="Mirra: la parola impossibile" aria-label="Ingrandisci la mappa: Mirra: la parola impossibile"><img src="./assets/mappe/mirra.svg" alt="Desiderio per il padre incontra la Resistenza della volontà. Resistenza della volontà si esprime in Silenzio e reticenza. Silenzio e reticenza provocano le Domande degli affetti. Domande degli affetti conducono alla Verità pronunciata. Verità pronunciata coincide con la Catastrofe senza liberazione."></button><figcaption>Mirra: la parola impossibile</figcaption></figure></div></main><dialog class="map-modal" data-map-modal><div class="modal-inner"><div class="modal-bar"><strong data-map-title>Mappa</strong><button class="modal-close" type="button" data-close-modal>Chiudi</button></div><img class="modal-image" src="" alt=""></div></dialog><script src="./assets/js/content.js" defer></script><script src="./assets/js/app.js" defer></script></body></html>
